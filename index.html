/**
 * Modal dialog. Resolves null on cancel, otherwise the button's value.
 * Fields stay in the DOM until the next tick so the caller can still read
 * them after awaiting the dialog.
 */
/**
 * Small panel anchored under an element. Closes on a second click, an outside
 * click, Escape, a scroll or a resize, and never outlives the element it hangs
 * from — re-rendering a page therefore takes it away with the anchor.
 */
let __pop = null;
function closePop(){
  if(!__pop) return;
  const p = __pop;
  __pop = null;
  p.el.remove();
  if(p.anchor && p.anchor.isConnected) p.anchor.setAttribute('aria-expanded','false');
  window.removeEventListener('mousedown', p.away, true);
  window.removeEventListener('resize', closePop);
  window.removeEventListener('scroll', closePop, true);
  document.removeEventListener('keydown', p.esc);
  document.removeEventListener('focusin', p.focus, true);
}
function popover(anchor, html){
  if(__pop && __pop.anchor === anchor){ closePop(); return; }
  closePop();
  const el = document.createElement('div');
  el.className = 'pop';
  el.innerHTML = html;
  document.body.appendChild(el);
  /* Viewport coordinates: the trigger is by definition on screen when it is
     clicked, so the panel is always beside it and never lands off-page. */
  const place = () => {
    const r = anchor.getBoundingClientRect();
    const w = el.offsetWidth, h = el.offsetHeight, vw = document.documentElement.clientWidth;
    const vh = document.documentElement.clientHeight;
    let left = r.right - w;
    if(left + w + 8 > vw) left = vw - w - 8;
    if(left < 8) left = 8;
    let top = r.bottom + 7;
    if(top + h > vh - 8) top = r.top - h - 7;
    if(top < 8) top = 8;
    if(top + h > vh - 8) top = Math.max(8, vh - h - 8);
    el.style.left = Math.round(left) + 'px';
    el.style.top = Math.round(top) + 'px';
  };
  place();
  anchor.setAttribute('aria-expanded','true');
  const p = {el, anchor};
  p.away = e => { if(!el.contains(e.target) && !anchor.contains(e.target)) closePop(); };
  p.esc  = e => { if(e.key === 'Escape') closePop(); };
  /* Focus counts as being outside, so tabbing into the grid puts it away. */
  p.focus = e => { if(!el.contains(e.target) && !anchor.contains(e.target)) closePop(); };
  __pop = p;
  /* Deferred, so the click that opened the panel does not close it again. */
  setTimeout(() => {
    window.addEventListener('mousedown', p.away, true);
    window.addEventListener('resize', closePop);
    window.addEventListener('scroll', closePop, true);
    document.addEventListener('keydown', p.esc);
    document.addEventListener('focusin', p.focus, true);
  }, 0);
}
function modal(opts){
  return new Promise(resolve => {
    const btns = opts.buttons || [{label:'Close'}];
    const body = document.createElement('div');
    body.className = 'db';
    body.innerHTML = opts.body || '';

    const dlg = document.createElement('div');
    dlg.className = 'dlg';
    if(opts.wide) dlg.style.maxWidth = opts.wide + 'px';

    const head = document.createElement('div');
    head.className = 'dh';
    const title = document.createElement('span');
    title.textContent = opts.title || '';
    const xb = document.createElement('button');
    xb.className = 'sm';
    xb.textContent = '✕';
    head.appendChild(title);
    head.appendChild(xb);

    const foot = document.createElement('div');
    foot.className = 'df';
    btns.forEach(b => {
      const el = document.createElement('button');
      el.textContent = b.label;
      if(b.cls) el.className = b.cls;
      el.onclick = () => done(b.value === undefined ? true : b.value);
      foot.appendChild(el);
    });

    dlg.appendChild(head); dlg.appendChild(body); dlg.appendChild(foot);
    const ovl = document.createElement('div');
    ovl.className = 'ovl';
    ovl.appendChild(dlg);
    document.body.appendChild(ovl);
    /* A dialog that fills itself in later — a preview waiting on a file, say —
     is handed its own body and footer so it can show something at once. */
    if(opts.onOpen) opts.onOpen(body, foot);

    let closed = false;
    function done(v){
      if(closed) return;
      closed = true;
      resolve(v);
      setTimeout(() => ovl.remove(), 0);
    }
    xb.onclick = () => done(null);
    ovl.addEventListener('mousedown', e => { if(e.target === ovl) done(null); });
    const first = $('input,textarea,select', body);
    if(first) setTimeout(() => first.focus(), 50);
  });
}

/* ---------- DASHBOARD: the whole school at a glance ---------- */
/* Builders for the "School at a glance" detail panels, filled in by
   renderDashboard() each time the page is drawn. */
let KPI_DETAIL = {};
/**
 * Gather every class on every grade for one paper. Each class is worked out with
 * its own subject list, so a Grade 3 average never borrows Grade 9 subjects.
 */
function schoolSnapshot(examId){
  const grades = (App.settings.gradeProfiles || []).map(p => p.label);
  const out = grades.map(grade => {
    const cohorts = App.settings.cohorts.filter(c => (c.grade || '') === grade);
    const subs = subjectsOfCohort({grade:grade});
    const learners = App.learners.filter(l => cohorts.some(c => c.id === l.cohortId));
    const rows = App.raw
      .filter(r => r.assessmentId === examId && cohorts.some(c => c.id === r.cohortId))
      .map(r => computeRow(r, subs));
    const graded = rows.filter(r => r.average !== null);
    const dist = {EE:0, ME:0, AE:0, BE:0};
    graded.forEach(r => { const k = category(r.average); if(k) dist[k]++; });
    const mean = classMean(graded, subs);
    const subjects = {};
    subs.forEach(s => {
      const nm = s.name;
      let sum = 0, n = 0;
      rows.forEach(r => { if(r.pct[nm] !== null){ sum += r.pct[nm]; n++; } });
      subjects[nm] = n ? r1(sum / n) : null;
    });
    return {grade, classes:cohorts.length, learners:learners.length, graded:graded.length,
            rows:rows, dist, mean, subjects, subs,
            complete:learners.length ? Math.round(graded.length / learners.length * 100) : 0};
  });
  return out;
}
/** A column chart of how many learners sit in each grade. */
function gradeColumns(snap){
  const usable = snap.filter(g => g.learners > 0);
  if(!usable.length) return '<p class="hint">No learners are enrolled yet.</p>';
  const W = 720, H = 210, padL = 44, padB = 46, padT = 16;
  const max = Math.max.apply(null, usable.map(g => g.learners).concat([1]));
  const slot = (W - padL - 16) / usable.length;
  const bw = Math.min(46, slot * 0.56);
  const y = v => H - padB - (v / max) * (H - padB - padT);
  const ticks = [0, 0.5, 1].map(f => Math.round(max * f));
  return `<div class="tw"><svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img"
    aria-label="Learners per grade">
    ${[...new Set(ticks)].map(t => `<line x1="${padL}" x2="${W - 16}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"
        stroke="#e3e8ee" stroke-width="1"/>
      <text x="${padL - 8}" y="${(y(t) + 3.5).toFixed(1)}" font-size="10" fill="#6b7280" text-anchor="end">${t}</text>`).join('')}
    ${usable.map((g, i) => {
      const x = padL + i * slot + (slot - bw) / 2;
      const gg = grade(g.mean);
      const col = gg ? {EE:'#15803d', ME:'#2563eb', AE:'#d97706', BE:'#b91c1c'}[category(g.mean)] || '#0f5132' : '#94a3b8';
      return `<rect x="${x.toFixed(1)}" y="${y(g.learners).toFixed(1)}" width="${bw.toFixed(1)}"
          height="${(H - padB - y(g.learners)).toFixed(1)}" fill="${col}" rx="3"/>
        <text x="${(x + bw / 2).toFixed(1)}" y="${(y(g.learners) - 5).toFixed(1)}" font-size="10.5"
          font-weight="700" fill="#1f2937" text-anchor="middle">${g.learners}</text>
        <text x="${(x + bw / 2).toFixed(1)}" y="${H - padB + 15}" font-size="10" fill="#374151"
          text-anchor="middle">${esc(String(g.grade).replace('Grade ', 'G'))}</text>
        <text x="${(x + bw / 2).toFixed(1)}" y="${H - padB + 28}" font-size="9" fill="#6b7280"
          text-anchor="middle">${g.mean === null ? '—' : fx(g.mean, 0) + '%'}</text>`;
    }).join('')}
    <text x="${W / 2}" y="${H - 6}" font-size="9.5" fill="#94a3b8" text-anchor="middle">
      bar height = learners enrolled · figure below = grade mean</text>
  </svg></div>`;
}
function renderDashboard(){
  const s = App.settings;
  const examId = activeExam(), exam = activeExamObj();
  const snap = schoolSnapshot(examId);
  const withLearners = snap.filter(g => g.learners > 0);
  const totals = withLearners.reduce((a, g) => ({
    learners:a.learners + g.learners, classes:a.classes + g.classes, graded:a.graded + g.graded,
    EE:a.EE + g.dist.EE, ME:a.ME + g.dist.ME, AE:a.AE + g.dist.AE, BE:a.BE + g.dist.BE}), 
    {learners:0, classes:0, graded:0, EE:0, ME:0, AE:0, BE:0});
  /* The school mean is the mean of every grade's class means, so a big grade
     cannot drown out a small one. */
  const meanGrades = withLearners.filter(g => g.mean !== null);
  const schoolMean = meanGrades.length
    ? r1(meanGrades.reduce((a, g) => a + g.mean, 0) / meanGrades.length) : null;
  const og = grade(schoolMean);
  const complete = totals.learners ? Math.round(totals.graded / totals.learners * 100) : 0;
  const papers = assessments().filter(a => App.raw.some(r => r.assessmentId === a.id)).length;

  allSubs.forEach(name => {

    if(n) subjectRows.push({k:name, v:r1(sum / n)});

  const catGrades = [...new Set(catRows.map(x => x.c.grade))];

  const tiles = [

/**
 * Show or hide the detail panel under "School at a glance". Clicking the tile
 * again closes it, and only one figure is open at a time.
 */
function openKpi(key, btn){
  const panel = $('#kpiDetail');
  if(!panel) return;
  const same = panel.dataset.key === key && !panel.hidden;
  $$('#view .kpi').forEach(b => {
    b.classList.remove('sel');
    b.setAttribute('aria-expanded', 'false');
  });
  if(same){
    panel.hidden = true; panel.innerHTML = ''; delete panel.dataset.key;
    return;
  }
  const build = KPI_DETAIL && KPI_DETAIL[key];
  if(!build){ panel.hidden = true; return; }
  panel.innerHTML = build();
  panel.hidden = false;
  panel.dataset.key = key;
  btn.classList.add('sel');
  btn.setAttribute('aria-expanded', 'true');
  $$('#view [data-goto]').forEach(b => {
    b.onclick = () => gotoLearnerMarks(b.dataset.goto, b.dataset.exam);
  });
  $$('#view [data-opencohort]').forEach(b => {
    b.onclick = async () => {
      await openClassById(b.dataset.opencohort, 'classlist');
    };
  });
  $$('#view [data-gocat]').forEach(b => {
    b.onclick = async () => {
      await openClassById(b.dataset.gocat, 'cat');
    };
  });
}
/**
 * Jump from the dashboard straight into a learner's mark grid: open their
 * class, open their paper, give them a row if they have none, then put the
 * caret in the first subject box.
 */
async function gotoLearnerMarks(learnerId, examId){
  const l = learnerById(learnerId);
  const c = l && App.settings.cohorts.find(x => x.id === l.cohortId);
  if(!l || !c) return;
  if(App.settings.grade !== c.grade) await switchGrade(c.grade, {skipConfirm:true});
  App.settings.activeCohortId = c.id;
  App.settings.stream = c.stream || '';
  App.settings.year = c.year || App.settings.year;
  loadProfileForGrade(c.grade);
  await saveSettings();

  App.filters.exam = examId;
  App.filters.page = 1;
  const ex = examById(examId);
  let row = App.raw.find(r => r.learnerId === l.id && r.cohortId === c.id && r.assessmentId === examId);
  if(!row){
    row = {id:uid(), learnerId:l.id, assessmentId:examId, term:ex ? ex.term : activeTerm(),
           cohortId:c.id, marks:{}};
    App.raw.push(row);
    await saveRaw();
  }
  go('raw');

  /* Page forward if the learner sits beyond the first page of rows. */
  const ordered = rawRowsForExam(examId).slice().sort((a,b) =>
    (learnerById(a.learnerId) ? learnerById(a.learnerId).sno : 999)
    - (learnerById(b.learnerId) ? learnerById(b.learnerId).sno : 999));
  const idx = ordered.findIndex(r => r.learnerId === l.id);
  if(idx >= PAGE_SIZE){ App.filters.page = Math.floor(idx / PAGE_SIZE) + 1; renderRaw(); }

  const box = $('#rawTable input.mk[data-row="' + row.id + '"]');
  if(box){
    const tr = box.closest('tr');
    if(tr) tr.classList.add('flash');
    box.focus();
    box.scrollIntoView({block:'center', behavior:'smooth'});
  }
  toast('Entering marks for ' + (l.name || 'learner') + ' — ' + cohortLabel(c) + '.', {ms:4500});
}

/** The subject set a new grade should start with: junior below, senior above. */
function defaultSubjectsForGrade(label){
  const m = /(\d+)/.exec(String(label || ''));
  const n = m ? Number(m[1]) : 1;
  return clone(n >= 7 ? JUNIOR_SUBJECTS : LOWER_SUBJECTS);
}
/** Insert a grade so the list stays in ascending order. */
function insertGradeSorted(profile){
  const list = App.settings.gradeProfiles;
  const num = l => { const m = /(\d+)/.exec(String(l || '')); return m ? Number(m[1]) : 0; };
  let i = 0;
  while(i < list.length && num(list[i].label) <= num(profile.label)) i++;
  list.splice(i, 0, profile);
  return i;
}
/**
 * Add a grade. It is created with the usual subject set and opens with a fresh
 * class, so it behaves exactly like the built-in grades from the first moment.
 */
async function addGrade(){
  const typed = await promptBox('Add grade',
    'Name for the new grade, for example <b>Grade 10</b> or <b>Form 1</b>. ' +
    'It starts with the usual subjects and opens with one empty class.', '');
  if(typed === null) return;
  const label = String(typed).trim().replace(/\s+/g, ' ');
  if(!label){ toast('Type a name for the grade.', {bad:true}); return; }
  const dupe = gradeOrder().find(g => g.toLowerCase() === label.toLowerCase());
  if(dupe){
    await confirmBox(`<b>${esc(dupe)}</b> already exists, so no grade was added.`,
      {title:'Grade already exists', okLabel:'Close', cancelLabel:'Close'});
    renderGrades();
    return;
  }
  const ok = await confirmBox(
    `Add the grade <b>${esc(label)}</b>?<br><br>It starts with the usual subjects and opens with one empty class, ` +
    'just like the built-in grades.',
    {title:'Add grade', okLabel:'Yes, add the grade'});
  if(!ok){ renderGrades(); return; }

  const profile = {id:'g_' + uid(), label:label, subjects:defaultSubjectsForGrade(label)};
  insertGradeSorted(profile);
  const c = ensureCohort(label, '', true);
  c.name = label;
  App.settings.activeCohortId = c.id;
  App.settings.grade = label;
  App.settings.stream = '';
  loadProfileForGrade(label);
  await saveSettings();
  paintChrome();
  renderGrades();
  toast('Added ' + label + ' — ' + App.settings.subjects.length + ' subjects, one empty class.');
}
/** Rename a grade, keeping its profile and every class on it. */
async function editGrade(oldLabel){
  const prof = App.settings.gradeProfiles.find(p => p.label === oldLabel);
  if(!prof) return;
  const typed = await promptBox('Edit grade',
    `Rename <b>${esc(oldLabel)}</b>. All classes, learners and marks on this grade keep their place.`,
    oldLabel);
  if(typed === null) return;
  const label = String(typed).trim().replace(/\s+/g, ' ');
  if(!label){ toast('Type a name for the grade.', {bad:true}); return; }
  if(label === oldLabel){ toast('Nothing changed.'); return; }
  const dupe = gradeOrder().find(g => g !== oldLabel && g.toLowerCase() === label.toLowerCase());
  if(dupe){
    await confirmBox(`<b>${esc(dupe)}</b> already exists, so the grade was not renamed.`,
      {title:'Grade already exists', okLabel:'Close', cancelLabel:'Close'});
    renderGrades();
    return;
  }
  const classes = App.settings.cohorts.filter(c => (c.grade || '') === oldLabel).length;
  const ok = await confirmDelete('this grade name',
    `<b>${esc(oldLabel)}</b> will become <b>${esc(label)}</b>. ` +
    `Its <b>${classes}</b> class(es), learners, marks, CATs and remarks all follow the new name.`,
    {verb:'change', title:'Edit grade', okLabel:'Yes, save the name'});
  if(!ok){ renderGrades(); return; }

  prof.label = label;
  const mine = App.settings.cohorts.filter(c => (c.grade || '') === oldLabel);
  mine.forEach(c => { c.grade = label; c.name = label + (c.stream ? ' ' + c.stream : ''); });
  if(App.settings.grade === oldLabel){
    App.settings.grade = label;
    App.settings.stream = mine[0] ? (mine[0].stream || '') : '';
    App.settings.activeCohortId = mine[0] ? mine[0].id : App.settings.activeCohortId;
    loadProfileForGrade(label);
  }
  await saveSettings();
  paintChrome();
  renderGrades();
  toast('Renamed to ' + label + '.');
}
/** Remove a grade and every class on it, after confirming. */
async function removeGrade(label){
  const classes = App.settings.cohorts.filter(c => (c.grade || '') === label);
  const lns = App.learners.filter(l => classes.some(c => c.id === l.cohortId));
  const ids = classes.map(c => c.id);
  const rows = App.raw.filter(r => ids.indexOf(r.cohortId) >= 0);
  const cats = App.cats.filter(x => ids.indexOf(x.cohortId) >= 0);
  const wasGrade = App.settings.grade === label;
  const ok = await confirmDelete('the grade ' + label,
    `It holds <b>${classes.length}</b> class(es), <b>${lns.length}</b> learner(s), <b>${rows.length}</b> mark row(s) ` +
    `and <b>${cats.length}</b> CAT record(s). All of it goes permanently.` +
    '<br><br>Export a backup first if you may need them again.',
    {verb:'remove', title:'Remove grade', okLabel:'Yes, remove the grade'});
  if(!ok){ renderGrades(); return; }

  /* Delete each class without its own prompt, then drop the profile. */
  for(const c of classes.slice()) await deleteCohort(c.id, {ask:false, last:true, keepGrade:true});
  App.settings.gradeProfiles = App.settings.gradeProfiles.filter(p => p.label !== label);
  if(!App.settings.gradeProfiles.length){
    App.settings.gradeProfiles = clone(GRADE_PROFILES);
  }
  if(wasGrade){
    const order = gradeOrder();
    const fallback = order[Math.min(currentGradeIndex() < 0 ? 0 : currentGradeIndex(), order.length - 1)]
      || order[0];
    App.settings.grade = fallback;
    const first = App.settings.cohorts.find(c => (c.grade || '') === fallback);
    if(first){ App.settings.activeCohortId = first.id; App.settings.stream = first.stream || ''; }
    else { const nc = ensureCohort(fallback, '', true); nc.name = fallback; App.settings.activeCohortId = nc.id; }
    loadProfileForGrade(fallback);
  }
  await saveSettings();
  paintChrome();
  renderGrades();
  toast('Removed ' + label + '.');
}

/** Clear marks, CATs and remarks for every class on a grade, in one confirmed step. */
async function clearGradeMarks(label){
  const ids = App.settings.cohorts.filter(c => (c.grade || '') === label).map(c => c.id);
  const rows = App.raw.filter(r => ids.indexOf(r.cohortId) >= 0);
  const cats = App.cats.filter(x => ids.indexOf(x.cohortId) >= 0);
  const lns = App.learners.filter(l => ids.indexOf(l.cohortId) >= 0);
  const rem = Object.keys(App.remarks).filter(k => lns.some(l => k.indexOf(l.id + '|') === 0)).length;
  if(!rows.length && !cats.length && !rem){
    toast('There are no marks to clear on ' + label + '.');
    return;
  }
  const ok = await confirmDelete('all the marks on ' + label,
    `<b>${ids.length}</b> class(es) hold <b>${rows.length}</b> mark row(s), <b>${cats.length}</b> CAT record(s) ` +
    `and <b>${rem}</b> report remark(s).<br><br>The classes and their <b>${lns.length}</b> learner(s) all stay exactly as they are.`,
    {verb:'clear', title:'Clear ' + label + ' marks', okLabel:'Yes, clear the marks',
     cancelLabel:'No, keep the marks'});
  if(!ok) return;
  const set = {};
  ids.forEach(i => { set[i] = true; });
  lns.forEach(l => delete App.remarks[l.id + '|' + App.filters.exam]);
  Object.keys(App.remarks).forEach(k => {
    if(lns.some(l => k.indexOf(l.id + '|') === 0)) delete App.remarks[k];
  });
  App.raw  = App.raw.filter(r => !set[r.cohortId]);
  App.cats = App.cats.filter(x => !set[x.cohortId]);
  await saveRaw(); await saveCats(); await saveRemarks();
  paintChrome();
  renderGrades();
  toast('Cleared the marks on ' + label + '.');
}

/* ---------- Grade switching and promotion ---------- */
function gradeOrder(){ return (App.settings.gradeProfiles || []).map(p => p.label); }
function currentGradeIndex(){ return gradeOrder().indexOf(App.settings.grade); }
function nextGradeLabel(){
  const list = gradeOrder(), i = currentGradeIndex();
  return (i >= 0 && i + 1 < list.length) ? list[i + 1] : null;
}
function isTopGrade(){ return nextGradeLabel() === null; }
function totalSubjectsOf(s){ return (s.subjects || []).length; }

/**
 * Promote the whole class to the next grade: names and UPIs carry over into
 * a fresh cohort for that grade, marks and CATs stay behind in the old grade.
 * Grade 9 has nowhere to go, so it offers "reserve" (keep the register) or a
 * full removal of the learners instead.
 */
async function promoteLearners(){
  const s = App.settings;
  const mine = learnersOfCohort().slice().sort((a,b) => a.sno - b.sno);
  if(!mine.length){ toast('There are no learners in ' + cohortLabel() + ' to promote.'); return; }
  const coh = s.activeCohortId, goneIds = mine.map(l => l.id);
  /* A class that has moved on keeps nothing behind: marks, CATs and remarks go with it. */
  const clearOld = () => {
    Object.keys(App.remarks).forEach(k => { if(goneIds.some(id => k.indexOf(id + '|') === 0)) delete App.remarks[k]; });
    App.raw  = App.raw.filter(r => r.cohortId !== coh);
    App.cats = App.cats.filter(c => c.cohortId !== coh);
  };

  if(isTopGrade()){
    const ok = await confirmBox(
      `<b>${esc(s.grade)}</b> is the last grade, so there is no higher grade to promote into.<br><br>
       All <b>${mine.length} learner(s)</b> will be <b>deleted</b> from <b>${esc(cohortLabel())}</b>,
       together with their marks, CATs and remarks.<br>
       <span class="hint">Press <b>Undo</b> straight afterwards if this was a mistake.</span>`,
      {title:'Finish this class', okLabel:'Delete the class', cancelLabel:'Keep them'});
    if(!ok) return;
    App.learners = App.learners.filter(l => l.cohortId !== coh);
    clearOld();
    const c = cohort(); c.outcome = 'removed'; c.reservedAt = Date.now();
    await saveLearners(); await saveRaw(); await saveCats(); await saveRemarks(); await saveSettings();
    toast(mine.length + ' learner(s) removed from ' + cohortLabel() + '.');
    go('classlist');
    return;
  }

  const next = nextGradeLabel();
  const target = ensureCohort(next, '', true);
  const ok = await confirmBox(
    `Move <b>${mine.length} learner(s)</b> from <b>${esc(cohortLabel())}</b> to <b>${esc(next)}</b>?<br><br>
     They leave ${esc(cohortLabel())} completely — names and ASS numbers move up, and this grade's marks,
     CATs and remarks are cleared.<br>
     <span class="hint">Press <b>Undo</b> straight afterwards if this was a mistake.</span>`,
    {title:'Promote to ' + next, okLabel:'Promote the class'});
  if(!ok) return;

  let moved = 0, dropped = 0;
  mine.forEach(l => {
    const dup = App.learners.some(x => x.cohortId === target.id && x.id !== l.id &&
      ((l.upi && x.upi === l.upi) || x.name === l.name));
    if(dup){ App.learners = App.learners.filter(x => x.id !== l.id); dropped++; }
    else{ l.cohortId = target.id; moved++; }
  });
  clearOld();
  resnoIn(target.id); resnoIn(coh);
  const c = cohort();
  c.outcome = 'promoted'; c.promotedTo = next; c.promotedAt = Date.now();
  await saveLearners(); await saveRaw(); await saveCats(); await saveRemarks(); await saveSettings();
  toast(moved + ' learner(s) moved to ' + next + (dropped ? ' (' + dropped + ' already there)' : '') + '.');
  go('classlist');
}
function learnersOfCohortCount(cohortId){
  return App.learners.filter(l => l.cohortId === cohortId).length;
}
function resnoIn(cohortId){
  App.learners.filter(l => l.cohortId === cohortId)
    .sort((a,b) => a.sno - b.sno)
    .forEach((l,i) => { l.sno = i + 1; });
}

/**
 * Save one learner from their own row, so a single learner's details can be
 * confirmed without touching the rest of the page. The name cannot be blanked:
 * it falls back to what was already stored, and the row flashes to show it went in.
 */
async function saveOneLearner(id){
  const l = learnerById(id);
  if(!l) return;
  const row = $$('#clBody tr').find(tr => tr.querySelector('[data-save="' + id + '"]'));
  const upi  = row ? $('[data-f="upi"]',  row) : null;
  const name = row ? $('[data-f="name"]', row) : null;
  const newName = name ? name.value.trim() : l.name;
  const newUpi  = upi  ? upi.value.trim()  : l.upi;
  if(!newName && !newUpi){
    toast('Type a UPI (ASS NO) or a Learner Name before saving.', {bad:true});
    if(name){ name.focus(); name.select(); }
    return;
  }
  const changed = newName !== l.name || newUpi !== l.upi;
  l.name = newName;
  l.upi  = newUpi;
  await saveLearners();
  if(name) name.value = newName;
  if(upi)  upi.value  = newUpi;
  if(row){
    row.classList.add('saved');
    setTimeout(() => row.classList.remove('saved'), 1100);
  }
  toast(changed ? 'Saved ' + newName + '.' : newName + ' — already up to date.', {ms:2600});
}

/**
 * What has been captured for one learner, split into the four columns shown on
 * the class list: CAT records and the exam papers of each term.
 */
function learnerProgress(l){
  const byTerm = {'Term I':new Set(), 'Term II':new Set(), 'Term III':new Set()};
  rawOfCohort().forEach(r => {
    if(r.learnerId !== l.id) return;
    if(!Object.keys(r.marks || {}).length) return;
    const a = examById(r.assessmentId);
    if(a && byTerm[a.term]) byTerm[a.term].add(a.id);
  });
  const cats = catsOfCohort().filter(c => (c.marks || {})[l.id] !== undefined &&
    (c.marks || {})[l.id] !== null && (c.marks || {})[l.id] !== '').length;
  return {cats:cats, t1:byTerm['Term I'].size, t2:byTerm['Term II'].size, t3:byTerm['Term III'].size};
}
function classRow(l){
  const p = learnerProgress(l);
  const cell = (n, what) =>
    `<td class="num" title="${esc(what)}">${n || '<span class="hint">—</span>'}</td>`;
  return `<tr>
    <td class="num">${l.sno}</td>
    <td><input data-f="upi" data-id="${l.id}" value="${esc(l.upi)}"></td>
    <td><input type="text" data-f="name" data-id="${l.id}" value="${esc(l.name)}"></td>

      <button class="sm danger" data-del="${l.id}" title="Delete learner">🗑</button>

/** Enter in a name box jumps to the same box on the next row. */
function wireClassListKeys(){
  $$('#clBody input[data-f]').forEach(el => el.onkeydown = e => {
    if(e.key !== 'Enter') return;
    e.preventDefault();
    const all = $$('#clBody input[data-f="' + el.dataset.f + '"]');
    const i = all.indexOf(el);
    if(all[i + 1]){ all[i + 1].focus(); all[i + 1].select(); return; }
    /* Past the last visible row: save, then move to the next page or a new row. */
    collectInlineLearnerEdits().then(saveLearners).then(async () => {
      const n = classListAll().length;
      if(currentPage() < pageCount(n)) setPage(currentPage() + 1);
      else{
        await addLearner();
        toast('Last row reached — a new blank row was added.');
      }
    });
  });
}
async function addLearner(){
  const l = {id:uid(), sno:learnersOfCohort().length + 1, upi:'', name:'',
             cohortId:App.settings.activeCohortId};
  App.learners.push(l);
  resno();
  /* Follow the new row onto its page so the caret lands in the right box. */
  const idx = learnersOfCohort().slice().sort((a,b) => a.sno - b.sno).findIndex(x => x.id === l.id);
  if(idx >= PAGE_SIZE) App.filters.page = Math.floor(idx / PAGE_SIZE) + 1;
  await saveLearners(); renderClassList();
  const i = $('[data-f="name"][data-id="' + l.id + '"]');
  if(i){ i.focus(); i.select(); }
}
async function editLearner(id){
  const l = learnerById(id);
  if(!l) return;
  const r = await modal({
    title: 'Edit learner',
    body: `<div class="field"><label class="fl">UPI (ASS NO)</label><input id="eU" type="text" value="${esc(l.upi)}"></div>` +
      `<div class="field"><label class="fl">Learner Name</label><input id="eN" type="text" value="${esc(l.name)}"></div>`,
    buttons: [{label:'Cancel', value:null}, {label:'Save', value:'ok'}]
  });

/**
 * Learners can arrive as a spreadsheet, a Word table, a PDF or plain text.
 * Everything is unpacked in the browser — no file ever leaves this computer.
 */
const IMPORT_ACCEPT = '.csv,.txt,.tsv,.tab,.xlsx,.xlsm,.docx,.pdf,text/csv,text/plain,' +
                      'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,' +
                      'application/vnd.openxmlformats-officedocument.wordprocessingml.document,' +
                      'application/pdf';
function fileKind(f){
  const n = (f.name || '').toLowerCase();
  if(/\.xlsx$|\.xlsm$/.test(n)) return 'xlsx';
  if(/\.xls$/.test(n)) return 'xls';
  if(/\.docx$/.test(n)) return 'docx';
  if(/\.doc$/.test(n)) return 'doc';
  if(/\.pdf$/.test(n)) return 'pdf';
  const t = (f.type || '').toLowerCase();
  if(t.indexOf('pdf') >= 0) return 'pdf';
  if(t.indexOf('wordprocessing') >= 0 || t.indexOf('msword') >= 0) return 'docx';
  if(t.indexOf('spreadsheet') >= 0 || t.indexOf('excel') >= 0) return 'xlsx';
  return 'text';
}
const dec = new TextDecoder('utf-8');
const utf8 = b => dec.decode(b instanceof Uint8Array ? b : new Uint8Array(b));

async function inflateRaw(bytes){
  if(typeof DecompressionStream === 'undefined')
    throw new Error('This browser cannot unzip inside the page.');
  const ds = new DecompressionStream('deflate-raw');
  const w = ds.writable.getWriter();
  w.write(bytes); w.close();
  const buf = await new Response(ds.readable).arrayBuffer();
  return new Uint8Array(buf);
}
/**
 * Just enough of the ZIP format to open an .xlsx or a .docx: find the central
 * directory, then pull out the few parts we need.
 */
async function zipEntries(buf, wanted){
  const b = (buf instanceof Uint8Array) ? buf : new Uint8Array(buf);
  const dv = new DataView(b.buffer, b.byteOffset, b.byteLength);
  let eocd = -1;
  for(let i = b.length - 22; i >= Math.max(0, b.length - 66000); i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error('That file is not a readable Office document.');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const out = {};
  for(let i = 0; i < count && p + 46 <= b.length; i++){
    if(dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const csize   = dv.getUint32(p + 20, true);
    const fnLen   = dv.getUint16(p + 28, true);
    const exLen   = dv.getUint16(p + 30, true);
    const cmLen   = dv.getUint16(p + 32, true);
    const lho     = dv.getUint32(p + 42, true);
    const name    = utf8(b.subarray(p + 46, p + 46 + fnLen));
    if(wanted.some(w => name === w || name.indexOf(w) >= 0)){
      const lfn = dv.getUint16(lho + 26, true);
      const lex = dv.getUint16(lho + 28, true);
      const start = lho + 30 + lfn + lex;
      const data = b.subarray(start, start + csize);
      out[name] = method === 0 ? data : await inflateRaw(data);
    }
    p += 46 + fnLen + exLen + cmLen;
  }
  return out;
}
function xmlUnescape(s){
  return String(s).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"')
    .replace(/&apos;/g,"'").replace(/&#(\d+);/g, (m, d) => String.fromCharCode(+d))
    .replace(/&#x([0-9a-f]+);/gi, (m, h) => String.fromCharCode(parseInt(h, 16)))
    .replace(/&amp;/g,'&');
}
const colOf = ref => {
  const m = /([A-Z]+)/i.exec(ref || '');
  if(!m) return 0;
  let n = 0;
  for(const ch of m[1].toUpperCase()) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n - 1;
};
/** First worksheet of an .xlsx workbook, as an array of cell arrays. */
async function xlsxRows(buf){
  const files = await zipEntries(buf, ['xl/sharedStrings.xml', 'xl/worksheets/']);
  const shared = [];
  const ssKey = Object.keys(files).find(k => /sharedStrings\.xml$/.test(k));
  if(ssKey){
    const xml = utf8(files[ssKey]);
    const parts = xml.split('<si>').slice(1);
    parts.forEach(p => {
      let t = '';
      p.split(/<si[^>]*>/).forEach(() => {});
      const re = /<t[^>]*>([\s\S]*?)<\/t>/g;
      let m;
      while((m = re.exec(p))) t += xmlUnescape(m[1]);
      shared.push(t);
    });
  }
  const shKey = Object.keys(files).filter(k => /xl\/worksheets\/.*\.xml$/.test(k)).sort()[0];
  if(!shKey) throw new Error('That workbook has no readable sheet.');
  const xml = utf8(files[shKey]);
  const rows = [];
  const rowRe = /<row[^>]*>([\s\S]*?)<\/row>/g;
  let rm;
  while((rm = rowRe.exec(xml))){
    const cells = [];
    const cellRe = /<c\s([^>]*?)\/?>(?:([\s\S]*?)<\/c>)?/g;
    let cm;
    while((cm = cellRe.exec(rm[1]))){
      const attrs = cm[1] || '', inner = cm[2] || '';
      const ref = (/r="([^"]+)"/.exec(attrs) || [])[1] || '';
      const type = (/t="([^"]+)"/.exec(attrs) || [])[1] || 'n';
      let v = '';
      if(type === 's'){
        const ix = parseInt((/<v>([\s\S]*?)<\/v>/.exec(inner) || [])[1], 10);
        v = Number.isNaN(ix) ? '' : (shared[ix] || '');
      }else if(type === 'inlineStr'){
        const re = /<t[^>]*>([\s\S]*?)<\/t>/g;
        let m, t = '';
        while((m = re.exec(inner))) t += xmlUnescape(m[1]);
        v = t;
      }else{
        v = xmlUnescape((/<v>([\s\S]*?)<\/v>/.exec(inner) || [])[1] || '');
      }
      cells[colOf(ref)] = String(v).replace(/\s+/g, ' ').trim();
    }
    rows.push(cells);
  }
  return rows;
}
/** Every table (or list line) of a .docx document, as an array of cell arrays. */
async function docxRows(buf){
  const files = await zipEntries(buf, ['word/document.xml']);
  const key = Object.keys(files)[0];
  if(!key) throw new Error('That Word file has no readable text.');
  const xml = utf8(files[key]);
  const rows = [];
  const trRe = /<w:tr[\s>][\s\S]*?<\/w:tr>/g;
  let tr;
  let found = false;
  while((tr = trRe.exec(xml))){
    found = true;
    const cells = [];
    const tcRe = /<w:tc[\s>][\s\S]*?<\/w:tc>/g;
    let tc;
    while((tc = tcRe.exec(tr[0]))) cells.push(wordText(tc[0]));
    if(cells.some(c => c !== '')) rows.push(cells);
  }
  if(found && rows.length) return rows;
  /* No table: fall back to one line per paragraph. */
  const pRe = /<w:p[\s>][\s\S]*?<\/w:p>/g;
  let p;
  while((p = pRe.exec(xml))){
    const t = wordText(p[0]);
    if(t !== '') rows.push([t]);
  }
  return rows;
}
function wordText(chunk){
  let out = '';
  /* "w:t" must be the whole tag name, so <w:tc> and <w:tab/> are not mistaken
     for the start of a run of text. */
  const re = /<w:t(?:\s[^>]*)?>([\s\S]*?)<\/w:t>|<w:tab\s*\/>|<w:br\s*\/>/g;
  let m;
  while((m = re.exec(chunk))){
    if(m[1] !== undefined) out += xmlUnescape(m[1]);
    else if(m[0].indexOf('<w:tab') === 0) out += '\t';
    else out += ' ';
  }
  return out.replace(/[\s\u00a0]+/g, ' ').replace(/^\s+|\s+$/g, '');
}
/**
 * Best-effort text from a PDF: inflate the page streams and read the text
 * drawing operators. Works on ordinary text PDFs; a scanned PDF is a picture
 * and cannot be read, and that is explained to the teacher.
 */
async function pdfRows(buf){
  const b = (buf instanceof Uint8Array) ? buf : new Uint8Array(buf);
  const dv = new DataView(b.buffer, b.byteOffset, b.byteLength);
  const latin = new TextDecoder('windows-1252');
  let out = [];
  let p = 0;
  while(true){
    const i = latin.decode(b.subarray(p, Math.min(b.length, p + 3000))).indexOf('stream');
    if(i < 0) break;
    const head = latin.decode(b.subarray(p, p + i));
    const start = p + i + 6;
    let s = start;
    if(b[s] === 13 && b[s + 1] === 10) s += 2; else s += 1;
    const endRel = latin.decode(b.subarray(s, Math.min(b.length, s + 4000000))).indexOf('endstream');
    if(endRel < 0) break;
    const data = b.subarray(s, s + endRel);
    let text = '';
    if(/\/FlateDecode/.test(head)){
      try{ text = utf8(await inflateRaw(data)); }
      catch(_){ text = ''; }
    }else if(!/\/DCTDecode|\/JPXDecode|\/CCITTFaxDecode|\/Image/.test(head)){
      text = utf8(data);
    }
    if(/\bTJ\b|\bTj\b/.test(text)) out.push(pdfRuns(text));
    p = s + endRel + 9;
    if(p >= b.length) break;
  }
  /* Runs that share a baseline make one line; a wide horizontal jump starts a
     new cell, which is what keeps a name and its UPI apart. */
  const rows = [];
  out.forEach(runs => {
    const lines = [];
    runs.slice().sort((a, b) => b.y - a.y || a.x - b.x).forEach(r => {
      const line = lines.find(l => Math.abs(l.y - r.y) <= 2.5);
      if(!line){ lines.push({y:r.y, runs:[r]}); return; }
      line.runs.push(r);
    });
    lines.sort((a, b) => b.y - a.y).forEach(l => {
      l.runs.sort((a, b) => a.x - b.x);
      const cells = [];
      l.runs.forEach(r => {
        const last = cells.length ? cells[cells.length - 1] : null;
        if(last && r.x - last.x1 < 22){
          last.text += ' ' + r.text;
          last.x1 = Math.max(last.x1, r.x1);
        }else{
          cells.push({x:r.x, x1:r.x1, text:r.text});
        }
      });
      const row = cells.map(c => c.text).filter(t => t !== '');
      if(row.length) rows.push(row);
    });
  });
  return rows;
}
function pdfRuns(content){
  const runs = [];
  let x = 0, y = 0, buf = '', bx = 0;
  const flush = () => {
    const t = buf.replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, '');
    if(t) runs.push({x:bx, y:y, text:t});
    buf = '';
  };
  const NUM = '-?[\\d.]+';
  const re = new RegExp(
    '(?<tx>' + NUM + ')\\s+(?<ty>' + NUM + ')\\s+(?:Td|TD)' +
    '|(?<ma>' + NUM + ')\\s+(?<mb>' + NUM + ')\\s+(?<mc>' + NUM + ')\\s+(?<md>' + NUM + ')\\s+' +
    '(?<me>' + NUM + ')\\s+(?<mf>' + NUM + ')\\s+Tm' +
    '|\\[(?<arr>[^\\]]*)\\]\\s*TJ' +
    '|(?<str>\\((?:\\\\.|[^\\\\()])*\\)|<[0-9A-Fa-f\\s]+>)\\s*Tj' +
    '|(?<nl>T\\*|ET|BT)', 'g');
  let m;
  while((m = re.exec(content))){
    const g = m.groups;
    if(g.tx !== undefined){ flush(); x += parseFloat(g.tx); y += parseFloat(g.ty); bx = x; }
    else if(g.ma !== undefined){ flush(); x = parseFloat(g.me); y = parseFloat(g.mf); bx = x; }
    else if(g.arr !== undefined){ if(!buf) bx = x; buf += pdfArrayText(g.arr); }
    else if(g.str !== undefined){ if(!buf) bx = x; buf += pdfStrToken(g.str); }
    else if(g.nl !== undefined){ flush(); bx = x; if(g.nl === 'T*') y -= 12; }
  }
  flush();
  /* Width of each run, guessed from its characters, so column gaps can be seen. */
  runs.forEach(r => r.x1 = r.x + r.text.length * 5.2);
  return runs;
}
/** The inside of a [ … ] TJ array: strings in order, kerning gaps as spaces. */
function pdfArrayText(body){
  let out = '';
  const re = /\((?:\\.|[^\\()])*\)|<[0-9A-Fa-f\s]+>|-?[\d.]+/g;
  let m, pendingGap = false;
  while((m = re.exec(body))){
    const t = m[0];
    if(t[0] === '(' || t[0] === '<'){ out += (pendingGap ? ' ' : '') + pdfStrToken(t); pendingGap = false; }
    else if(Math.abs(parseFloat(t)) > 1.6) pendingGap = true;
  }
  return out;
}
function pdfStrToken(tok){
  if(tok[0] === '('){
    return tok.slice(1, -1).replace(/\\([nrtbf()\\])/g, (mm, c) =>
      ({n:'\n', r:'', t:'\t', b:'', f:''}[c] !== undefined ? ({n:'\n', r:'', t:'\t', b:'', f:''}[c]) : c));
  }
  if(tok[0] === '<'){
    const hex = tok.slice(1, -1).replace(/\s+/g, '');
    let v = '';
    for(let i = 0; i + 3 < hex.length; i += 4) v += String.fromCharCode(parseInt(hex.substr(i, 4), 16));
    return v;
  }
  return '';
}
/**
 * Work out which column holds the name and which the UPI, skipping headings and
 * noise rows, so a list exported from any system lands in the right columns.
 */
function rowsToLearnerList(rows){
  const clean = (rows || [])
    .map(r => (r || []).map(c => String(c == null ? '' : c).replace(/[\u00a0]/g, ' ').replace(/\s+/g, ' ').trim()))
    .filter(r => r.some(c => c !== ''));
  if(!clean.length) return {list:[], kept:0, skipped:0};

  /* Headings are matched loosely because they differ from school to school:
     "Full Name", "Learner Name", "UPI", "UPI (ASS NO)", "Admission No"… */
  const isNameH = c => c.length <= 34 && /\bname\b|\bpupil\b|\bstudent\b|\blearner\b/i.test(c);
  const isUpiH  = c => c.length <= 34 && /\bupi\b|\bass(ed)?\b|\badm\b|\badmission\b|\breg(istration)?\b|\bindex\b|\broll\b|\bno\.?\s*(id|no)?\b|\bid\b/i.test(c);
  const isSexH  = c => /^(sex|gender)$/i.test(c);
  const isNoH   = c => /^(s\/?no\.?|no\.?|#|index)$/i.test(c);
  let head = -1, nameCol = 0, upiCol = -1, sexCol = -1;
  for(let i = 0; i < Math.min(clean.length, 12); i++){
    const row = clean[i];
    if(row.length < 2) continue;
    const n = row.findIndex(c => isNameH(c) && !isUpiH(c) && !isNoH(c));
    if(n < 0) continue;
    let u = row.findIndex((c, ix) => ix !== n && isUpiH(c) && !isNoH(c) && !isNameH(c));
    if(u < 0) u = row.findIndex((c, ix) => ix !== n && isUpiH(c) && !isNameH(c));
    head = i; nameCol = n; upiCol = u; sexCol = row.findIndex((c, ix) => ix !== n && isSexH(c));
    break;
  }
  if(head < 0){
    /* No heading row. If most lines start with a row number, the name is the
       second column; otherwise the first column is the name. */
    const isU = v => /^[A-Za-z]?\d{4,}[A-Za-z0-9\/-]*$/.test(v || '');
    const need = Math.max(1, Math.floor(clean.length * 0.6));
    const numUpi = clean.filter(r => r.length >= 3 && /^\d{1,3}$/.test(r[0]) && isU(r[1]) && r[2] && !isU(r[2])).length;
    const upiFirst = clean.filter(r => r.length >= 2 && isU(r[0]) && r[1] && !isU(r[1])).length;
    const numbered = clean.filter(r => r.length >= 3 && /^\d{1,3}$/.test(r[0]) &&
      r[1] && !/^\d+$/.test(r[1])).length;
    if(numUpi >= need){ upiCol = 1; nameCol = 2; }
    else if(upiFirst >= need){ upiCol = 0; nameCol = 1; }
    else if(numbered >= need){ nameCol = 1; upiCol = 2; }
    else { nameCol = 0; upiCol = 1; }
  }
  /* A heading row that leaves out the numbering column, but rows that start
     with one, shifts the names and identifiers along by one. */
  if(head >= 0){
    const body = clean.slice(head + 1);
    const wide = body[0] ? body[0].filter(c => c !== '').length : 0;
    const headWide = clean[head].filter(c => c !== '').length;
    const firstCol = body.map(r => r[0] || '');
    if(wide > headWide && firstCol.length > 1 && firstCol.every(v => /^\d{1,4}$/.test(v))){
      nameCol += 1;
      if(upiCol >= 0) upiCol += 1;
    }
  }
  /* A column that just counts 1, 2, 3… is a row number, never an identifier. */
  if(upiCol >= 0){
    const vals = clean.slice(Math.max(0, head + 1), Math.max(0, head + 1) + 12)
      .map(r => (r[upiCol] || '')).filter(v => v !== '');
    if(vals.length > 1 && vals.every((v, i) => /^\d{1,4}$/.test(v) && Number(v) === Number(vals[0]) + i))
      upiCol = -1;
  }

  const list = [], seen = {};
  let skipped = 0;
  clean.slice(head < 0 ? 0 : head + 1).forEach(r => {
    const name = (r[nameCol] || '').trim();
    const upi  = upiCol >= 0 ? (r[upiCol] || '').trim() : '';
    const sex  = sexCol >= 0 ? (r[sexCol] || '').trim().slice(0, 1).toUpperCase() : '';
    if(!name || isNameH(name) || isUpiH(name) || isNoH(name) || /^\d+([.,]\d+)?$/.test(name)){
      skipped++; return;
    }
    const key = name.toLowerCase() + '|' + upi.toLowerCase();
    if(seen[key]){ skipped++; return; }
    seen[key] = 1;
    list.push({name:name, upi:upi, sex:(sex === 'M' || sex === 'F') ? sex : ''});
  });
  return {list:list, kept:list.length, skipped:skipped,
          head:(head >= 0 ? clean[head].filter(Boolean) : [])};
}
async function rowsFromFile(f, buf){
  const kind = fileKind(f);
  if(kind === 'xlsx') return await xlsxRows(buf);
  if(kind === 'docx') return await docxRows(buf);
  if(kind === 'pdf')  return await pdfRows(buf);
  if(kind === 'xls' || kind === 'doc')
    throw new Error('That is an old ' + kind.toUpperCase() + ' file. Open it and use ' +
      '“Save As” to make an .xlsx, .docx or a .csv, then import that.');
  return parseDelimited(utf8(buf));
}
/** Last-resort name finder: any cell that looks like a person's name (two or more words of letters). */
function looseNameList(rows){
  const out = [], seen = {};
  (rows || []).forEach(r => {
    const cells = (r || []).map(c => String(c == null ? '' : c).replace(/\s+/g, ' ').trim());
    const nm = cells.find(c => /^[A-Za-z][A-Za-z'’.\-]+( [A-Za-z][A-Za-z'’.\-]+)+$/.test(c) &&
      !/\b(name|upi|class|grade|term|school|list|total|sex|gender|admission)\b/i.test(c));
    if(!nm || seen[nm.toLowerCase()]) return;
    seen[nm.toLowerCase()] = 1;
    const upi = cells.find(c => c !== nm && /^[A-Za-z]?\d{4,}[A-Za-z0-9\/-]*$/.test(c)) || '';
    out.push({name:nm, upi:upi, sex:''});
  });
  return out;
}
async function importLearnersFile(){
  pickFileBytes(async (f, buf) => {
    let rows;
    try{ rows = await rowsFromFile(f, buf); }
    catch(e){ toast(e.message || 'That file could not be read.', {bad:true}); return; }

    let got = rowsToLearnerList(rows);
    if(!got.list.length){ const lo = looseNameList(rows); if(lo.length) got = {list:lo, skipped:0, head:[]}; }
    if(!got.list.length){
      toast('No learner names were found in ' + f.name +
        '. Put ASS NO (UPI) first and Learner Name second.' +
        (fileKind(f) === 'pdf'
          ? ' A PDF that is a scan of a page has no text to read — export the list to Excel or CSV instead.'
          : ''), {bad:true});
      return;
    }
    if(!learnersOfCohort().length){
      const n0 = await addLearnersBulk(got.list, false);
      renderClassList();
      toast(n0 + ' learner name(s) picked automatically from ' + f.name + ' into ' + cohortLabel() + '.');
      return;
    }
    const have = learnersOfCohort();
    const seen = new Set();
    have.forEach(l => { const u=(l.upi||'').trim().toLowerCase(), n=(l.name||'').trim().toLowerCase(); if(u) seen.add(u); if(n) seen.add(n); });
    const fresh = got.list.filter(l => {
      const u=(l.upi||'').trim().toLowerCase(), n=(l.name||'').trim().toLowerCase();
      if((u && seen.has(u)) || seen.has(n)) return false;
      seen.add(n); if(u) seen.add(u); return true;
    });
    if(!fresh.length){ toast('All ' + got.list.length + ' name(s) in ' + f.name + ' are already in ' + cohortLabel() + '.'); return; }
    const added = await addLearnersBulk(fresh, false);
    renderClassList();
    toast(added + ' name(s) picked automatically from ' + f.name +
      (got.list.length > added ? ' (' + (got.list.length - added) + ' duplicate(s) skipped)' : '') + ' into ' + cohortLabel() + '.');
  }, IMPORT_ACCEPT);
}

  const d = new Date();

  const mon = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const p = n => String(n).padStart(2, '0');

    ', ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/**
 * Filled-count audit: catches incomplete rows, values above the maximum,
 * negatives, decimals, marks for unknown subjects and duplicate names.
 */
function rawAudit(examId){
  const subs = subjectNames();          /* array of names */
  const rows = rawRowsForExam(examId);
  const of = {};
  subs.forEach(name => { of[name] = outOf(name, examId); });

  const incomplete = [], errors = [], seen = {}, duplicates = [];
  let filledTotal = 0, possible = rows.length * subs.length;

  /* Values still sitting in the grid but not yet in the model. */
  const typed = rawTypedValues();

  rows.forEach(r => {
    const l = learnerById(r.learnerId);
    const who = l ? l.name : '(row with no learner)';
    const name = l ? l.name.toLowerCase() : null;
    if(name){
      if(seen[name]) duplicates.push(who);
      seen[name] = true;
    }
    /* Model values first, then anything typed or cleared in the grid. */
    const over = typed[r.id] || {};
    const values = Object.assign({}, r.marks || {});
    Object.keys(over).forEach(k => { if(over[k] === null) delete values[k]; else values[k] = over[k]; });

    /* Counted from the merged marks, so the totals follow the grid live. */
    const c = rawMergedMarks(r, over);
    filledTotal += c.count;
    if(c.count > 0 && c.count < subs.length) incomplete.push(who + ' (' + c.count + '/' + subs.length + ')');

    Object.keys(values).forEach(k => {
      if(of[k] === undefined){
        errors.push(who + ': a mark is stored for “' + k +
          '”, which is not one of the current subjects — hidden here but kept in the backup');
        return;
      }
      const v = values[k];
      if(v === null || v === undefined || v === '') return;
      const n = parseFloat(v);
      if(!isFinite(n)) errors.push(who + ': “' + k + '” is not a number');
      else if(Math.abs(n - Math.round(n)) > 1e-9)
        errors.push(who + ': “' + k + '” has decimals (' + n + ') — enter a whole number');
      else if(n < 0) errors.push(who + ': “' + k + '” mark is negative (' + n + ')');
      else if(n > of[k]) errors.push(who + ': “' + k + '” is ' + fx(n,1) + ' but the maximum is ' + of[k]);
    });
    if(!l) errors.push('A row has no learner name.');
  });
  return {rows:rows.length, incomplete, errors, duplicates,
          filledTotal, possible, complete:rows.length - incomplete.length};
}

/** One row's marks with the grid's unsaved edits laid over them. */
function rawMergedMarks(row, over){
  const marks = {};
  Object.keys(row.marks || {}).forEach(k => {
    const v = row.marks[k];
    if(v !== '' && v !== null && v !== undefined) marks[k] = v;
  });
  Object.keys(over).forEach(k => { if(over[k] === null) delete marks[k]; else marks[k] = over[k]; });
  return computeRow({id:row.id, learnerId:row.learnerId, assessmentId:row.assessmentId,
                     term:row.term, cohortId:row.cohortId, marks});
}
/**
 * Everything the snapshot card shows for one paper. Typed-but-unsaved marks
 * are folded in first, so the tiles agree with the audit panel instead of
 * lagging behind the grid until Save.
 */
function rawSnapshot(examId){
  const subs = subjectNames();
  const typed = rawTypedValues();
  const rows = computedRows(examId)
    .map(c => typed[c.row.id] ? rawMergedMarks(c.row, typed[c.row.id]) : c);

  const means  = subs.map(k => ({k, v:classMean(rows, [k])}));
  const ranked = means.filter(m => m.v !== null).sort((a,b) => b.v - a.v);
  const filled = rows.reduce((a,c) => a + c.count, 0);
  const possible = rows.length * subs.length;
  return {
    rows, means, mean:classMean(rows),
    best: ranked[0] || null,
    worst: ranked.length > 1 ? ranked[ranked.length - 1] : null,
    filled, possible,
    pc: possible ? Math.round(filled / possible * 100) : 0,
    complete: rows.filter(c => c.count === subs.length).length,
    withMarks: rows.filter(c => c.average !== null).length,
    support: needSupport(rows),
    split: categorySplit(rows)
  };
}

/** Whole numbers only: rounds and returns null when unusable. */
function wholeNum(v){
  const n = num(v);
  if(n === null) return null;
  if(!isFinite(n)) return null;
  return Math.round(n);
}
function validateCell(inp){
  const raw = inp.value.trim();
  const row = App.raw.find(r => r.id === inp.dataset.row);
  const of = outOf(inp.dataset.sub, row ? row.assessmentId : activeExam());
  let bad = false;
  if(raw !== ''){
    const n = parseFloat(raw);
    if(!isFinite(n) || n < 0 || n > of) bad = true;
    else if(Math.abs(n - Math.round(n)) > 1e-9) bad = true;  /* whole numbers only */
  }
  inp.classList.toggle('bad', bad);
  if(row){
    const f = $('[data-filled="' + row.id + '"]');
    if(f){
      /* Counted from what is in the boxes right now, so the 9th mark shows 9/9 straight away. */
      const tot = App.settings.subjects.length; let n = 0;
      $$('#rawTable input.mk[data-row="' + row.id + '"]').forEach(i => {
        const v = i.value.trim(); if(v === '') return;
        const x = parseFloat(v), mx = outOf(i.dataset.sub, row.assessmentId);
        if(isFinite(x) && x >= 0 && x <= mx) n++;
      });
      f.textContent = n + '/' + tot;
      f.classList.toggle('warn', n > 0 && n < tot);
      const tr = f.closest('tr'); if(tr) tr.style.background = (n > 0 && n < tot) ? '#fffbeb' : '';
    }
  }
  return !bad;
}

/* ---------- IMPORT FILE / BULK PASTE for Exam Raw Marks and CAT ---------- */
const MI = {
  norm: t => String(t == null ? '' : t).toLowerCase().replace(/\(.*?\)/g, '').replace(/out\s*of\s*\d+/g, '').replace(/[^a-z0-9]/g, ''),
  whole: t => { const s = String(t == null ? '' : t).trim(); return /^\d+(\.0+)?$/.test(s) ? parseInt(s, 10) : (s === '' ? null : NaN); },
  isUPI: t => /^[A-Za-z]?\d{5,}$/.test(String(t).trim()),
  hasLetters: t => /[A-Za-z]{2,}/.test(String(t))
};
function miClean(rows){
  return (rows || []).map(r => (r || []).map(c => String(c == null ? '' : c).replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim()))
    .filter(r => r.some(c => c !== ''));
}
function miSubjectCol(h, subs){
  const n = MI.norm(h); if(!n) return null;
  let m = subs.find(s => MI.norm(s.name) === n);
  if(m) return m.name;
  const c = subs.filter(s => { const ns = MI.norm(s.name); return n.length >= 3 && (ns.startsWith(n) || n.startsWith(ns)); });
  return c.length === 1 ? c[0].name : null;
}
/* Turn rows into [{upi, name, exam, cells:[...marks in order], byCol:{subject:mark}, mark, remark}] */
function miParse(rows, mode, subs, matchExam){
  rows = miClean(rows);
  if(!rows.length) return [];
  let head = null;
  const first = rows[0];
  if(first.filter(c => c !== '').length >= 2 && !first.some(c => /^\d+(\.\d+)?$/.test(c)) && !first.some(c => MI.isUPI(c))) head = rows.shift();
  const out = [];
  let map = null;
  if(head){
    map = {subj:{}};
    head.forEach((h, i) => {
      const t = h.toLowerCase();
      if(/upi|adm|ass\s*n|assessment\s*n/.test(t) && map.upi === undefined) map.upi = i;
      else if(/name|learner/.test(t) && map.name === undefined) map.name = i;
      else if(/^exam|exam$/.test(t) && map.exam === undefined) map.exam = i;
      else if(/remark|comment|note|performance/.test(t) && map.remark === undefined) map.remark = i;
      else if(mode === 'cat' && /mark|score/.test(t) && map.mark === undefined) map.mark = i;
      else { const s = miSubjectCol(h, subs); if(s && map.subj[s] === undefined) map.subj[s] = i; }
    });
  }
  rows.forEach(r => {
    const o = {upi:'', name:'', exam:null, cells:[], byCol:{}, mark:null, remark:''};
    if(map){
      o.upi = map.upi !== undefined ? r[map.upi] || '' : '';
      o.name = map.name !== undefined ? r[map.name] || '' : '';
      if(map.exam !== undefined) o.exam = matchExam(r[map.exam]);
      for(const s in map.subj) o.byCol[s] = r[map.subj[s]];
      if(map.mark !== undefined) o.mark = r[map.mark];
      if(map.remark !== undefined) o.remark = r[map.remark] || '';
      o.useCols = Object.keys(map.subj).length > 0;
    } else {
      let last = -1;
      r.forEach((c, i) => {
        if(!o.upi && MI.isUPI(c)){ o.upi = c; last = Math.max(last, i); }
        else if(!o.exam && matchExam(c)){ o.exam = matchExam(c); last = Math.max(last, i); }
        else if(!o.name && MI.hasLetters(c)){ o.name = c; last = Math.max(last, i); }
      });
      const rest = r.slice(last + 1);
      o.cells = rest;
      if(mode === 'cat'){
        o.mark = rest.find(c => /^\d/.test(c)) || '';
        o.remark = rest.find(c => MI.hasLetters(c)) || '';
      }
    }
    if(o.upi || o.name) out.push(o);
  });
  return out;
}
async function miResolveLearners(items){
  const list = learnersOfCohort();
  const key = s => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
  const byUpi = {}, byName = {};
  list.forEach(l => { if(l.upi) byUpi[key(l.upi)] = l; byName[key(l.name)] = l; });
  const missing = [];
  items.forEach(o => {
    o.learner = (o.upi && byUpi[key(o.upi)]) || (o.name && byName[key(o.name)]) || null;
    if(!o.learner && o.name) missing.push(o);
  });
  let skipped = 0, added = 0;
  if(missing.length){
    const ok = await confirmBox('<b>' + missing.length + '</b> name(s) are not on the class list yet, for example <i>' +
      esc(missing.slice(0, 3).map(m => m.name).join(', ')) + '</i>.<br>Add them to ' + esc(cohortLabel()) + ' and import their marks?',
      {title:'New learners found', okLabel:'Add and import', cancelLabel:'Skip them'});
    if(ok){
      missing.forEach(o => {
        const l = {id:uid(), sno:learnersOfCohort().length + 1, upi:o.upi || '', name:o.name, cohortId:App.settings.activeCohortId};
        App.learners.push(l); o.learner = l; added++;
      });
      resno(); await saveLearners();
    }
  }
  items.forEach(o => { if(!o.learner) skipped++; });
  return {skipped, added};
}
async function miImportRaw(rows){
  if(isAverageExam(activeExam())){ toast('End Year Average is worked out automatically. Pick a real exam first.', {bad:true}); return; }
  const subs = App.settings.subjects, coh = App.settings.activeCohortId;
  const matchExam = t => { const x = String(t || '').trim().toLowerCase(); if(!x) return null;
    return assessments().find(a => a.type !== 'average' && (a.name.toLowerCase() === x || a.id.toLowerCase() === x)) || null; };
  const items = miParse(rows, 'raw', subs, matchExam);
  if(!items.length){ toast('No learner rows were found. Put UPI or Name first, then one column per subject.', {bad:true}); return; }
  const res = await miResolveLearners(items);
  let set = 0, bad = 0;
  items.forEach(o => {
    if(!o.learner) return;
    const ex = o.exam || activeExamObj();
    const vals = {};
    if(o.useCols) subs.forEach(s => { if(o.byCol[s.name] !== undefined) vals[s.name] = MI.whole(o.byCol[s.name]); });
    else subs.forEach((s, i) => { if(i < o.cells.length) vals[s.name] = MI.whole(o.cells[i]); });
    let row = App.raw.find(x => x.cohortId === coh && x.assessmentId === ex.id && x.learnerId === o.learner.id);
    let any = false;
    for(const name in vals){
      const v = vals[name];
      if(v === null) continue;
      if(isNaN(v) || v < 0 || v > outOf(name, ex.id)){ bad++; continue; }
      if(!row){ row = {id:uid(), learnerId:o.learner.id, assessmentId:ex.id, term:ex.term, cohortId:coh, marks:{}}; App.raw.push(row); }
      row.marks[name] = v; any = true;
    }
    if(any) set++;
  });
  await saveRaw(); renderRaw();
  toast('Marks imported for ' + set + ' learner(s).' + (res.added ? ' ' + res.added + ' new learner(s) added.' : '') +
    (res.skipped ? ' ' + res.skipped + ' row(s) skipped, learner not on the list.' : '') +
    (bad ? ' ' + bad + ' mark(s) ignored, not whole numbers within the exam maximum.' : ''));
}
async function miImportCat(rows){
  const c = findCat(App.filters.catId) || catsOfCohort()[0];
  if(!c){ toast('Create a CAT first with + New CAT.', {bad:true}); return; }
  const items = miParse(rows, 'cat', [{name:c.subject}], () => null);
  if(!items.length){ toast('No learner rows were found. Put UPI or Name first, then the mark.', {bad:true}); return; }
  const res = await miResolveLearners(items);
  let set = 0, bad = 0;
  items.forEach(o => {
    if(!o.learner) return;
    let raw = o.mark;
    if(raw == null || raw === '') raw = o.useCols ? (o.byCol[c.subject] || '') : '';
    const v = MI.whole(raw);
    if(v === null && !o.remark) return;
    if(v !== null){
      if(isNaN(v) || v < 0 || v > c.total){ bad++; return; }
      c.marks[o.learner.id] = v;
    }
    if(o.remark) c.marks[o.learner.id + '|note'] = o.remark;
    set++;
  });
  await saveCats(); paintCatSheet(c.id);
  toast('CAT marks imported for ' + set + ' learner(s) into ' + c.title + '.' + (res.added ? ' ' + res.added + ' new learner(s) added.' : '') +
    (res.skipped ? ' ' + res.skipped + ' row(s) skipped, learner not on the list.' : '') +
    (bad ? ' ' + bad + ' mark(s) ignored, not whole numbers up to ' + c.total + '.' : ''));
}

   it is kept until something changes. Printing or saving twice is then instant.

let __jobDocs = {};
function jobDocument(title, html, docTitle){
  const key = docTitle ? title + '|' + docTitle : title;
  if(__jobDocs[key]) return __jobDocs[key];
  /* Bare: every sheet opens with the school name, so the school name is the
     first thing on the page and nothing is printed above it. */
  return (__jobDocs[key] = buildPdfDoc(title, flattenSheetFields(html), true, docTitle));
}

/**

function autoRemark(l, c){

  const exam = examById(activeExam());
  if(!c || c.average === null || !c.filled.length)
    return who + ', no marks have been recorded for ' + (exam ? exam.name : 'this assessment') +
      ' yet. Please see the class teacher for an update.';

  const avg = c.average, g = grade(avg);
  const cat = category(avg);
  const marks = c.filled.map(s => ({s, p:c.pct[s]})).sort((a,b) => b.p - a.p);

  const me  = marks.filter(m => category(m.p) === 'ME');
  const low2 = marks.filter(m => category(m.p) === 'AE' || category(m.p) === 'BE');
  const missing = App.settings.subjects.map(x => x.name).filter(n => c.pct[n] === null);

     the plain description, exactly as the grade key words it. */
  const band = m => {
    const t = grade(m.p);
    return t ? t.level + ' - ' + t.desc : '—';
  };
  const one = m => m.s + ' (' + band(m) + ')';
  /* Name two at most, then give the count, so the sentence stays short. */
  const nameSome = arr => arr.length > 2
    ? one(arr[0]) + ' and ' + (arr.length - 1) + ' other subject' + (arr.length - 1 > 1 ? 's' : '')
    : listWords(arr.map(one));
  const plainSome = arr => arr.length > 2
    ? arr[0].s + ' and ' + (arr.length - 1) + ' other subject' + (arr.length - 1 > 1 ? 's' : '')
    : listWords(arr.map(m => m.s));

  /* 1. The overall result, named. */
  parts.push(who + ' attained an overall average of ' + fx(avg, 0) + '% (' +

  }else if(me.length){

      parts.push('Other subjects needing attention are ' + plainSome(low2.slice(1)) + '.');

  if(missing.length)
    parts.push('Note: ' + listWords(missing) + (missing.length > 1 ? ' still need' : ' still needs') +

  if(key === 'maxmarks'){
    const list = exams(), subs = s.subjects;
    let set = 0;
    list.forEach(a => {
      if(!a.outOf) return;
      subs.forEach(x => { if(a.outOf[x.name] !== undefined) set++; });
    });
    return [
      ['Exams', String(list.length)],
      ['Subjects', String(subs.length)],
      ['Own maximum set', set + ' of ' + (list.length * subs.length)]
    ];
  }
  if(key === 'grading'){
    const t = thresholds(), top = t[0], low = t[t.length - 1];
    return [
      ['Bands', String(t.length)],
      ['Highest', top ? top.abbr + ' · ' + top.range : '—'],
      ['Lowest', low ? low.abbr + ' · ' + low.range : '—']
    ];
  }
  if(key === 'classes'){
    const list = s.cohorts.filter(c => (c.grade || '') === s.grade);
    return [
      ['Grade', s.grade],
      ['Classes', String(list.length)],
      ['Open now', cohortLabel()],
      ['Learners enrolled', String(learnersOfCohort().length)]
    ];
  }
  if(key === 'security'){
    return [
      ['PIN lock', s.pin ? 'on' : 'off'],
      ['Last backup', s.lastBackup ? new Date(s.lastBackup).toLocaleDateString() : 'never'],
      ['Backup reminder', s.remindBackup ? 'on' : 'off']
    ];
  }
  return [];
}
/** The facts block and its "View more" tab, rebuilt whenever the state changes. */
function secPaint(card){
  const key = card.dataset.sec;
  const sum = card.querySelector('.sec-sum');
  if(!key || !sum) return;
  const facts = secFacts(key);
  const more = card.classList.contains('sec-more');
  sum.innerHTML =
    (facts.length
      ? '<dl class="sec-facts">' + facts.map(f =>
          `<div><dt>${esc(f[0])}</dt><dd>${esc(f[1])}</dd></div>`).join('') + '</dl>'
      : '') +
    `<button type="button" class="sec-more-btn" data-sec-more="${esc(key)}"
      aria-expanded="${more ? 'true' : 'false'}">${more ? 'Show less' : 'View more'}<span
      aria-hidden="true">${more ? '▴' : '▾'}</span></button>`;
}
/** Give a card its summary strip, if it has none yet. */
function secInit(card){
  if(card.querySelector('.sec-sum')) return;
  const bd = card.querySelector('.bd');
  if(!bd) return;
  const sum = document.createElement('div');
  sum.className = 'sec-sum';
  card.insertBefore(sum, bd);
}
/** Put a card into its remembered state. */
function secApply(card){
  secInit(card);
  const key = card.dataset.sec;
  if(!key) return;
  card.classList.toggle('sec-more', secFlag(key, 'more'));
  secPaint(card);
}
/** Wire every summary section inside `root`. Delegated, so re-renders are safe. */
function wireSections(root){
  if(!root) return;
  $$('.card.sec', root).forEach(secApply);
  if(root.__secWired) return;
  root.__secWired = true;
  root.addEventListener('click', e => {
    const hit = e.target.closest ? e.target : null;
    if(!hit) return;
    /* "View more" is the only thing on these cards that opens and closes. */
    const mb = hit.closest('.sec-more-btn');
    if(!mb || !root.contains(mb)) return;
    const card = mb.closest('.card.sec');
    if(!card) return;
    const more = !card.classList.contains('sec-more');
    card.classList.toggle('sec-more', more);
    secWriteState(card.dataset.sec, 'more', more);
    secPaint(card);
  });
}

/**
 * One notice is typed for the whole batch, so typing in any sheet's box updates
 * every other box in the batch at once — otherwise the teacher would have to
 * repeat the same notice on every learner's page.
 */
function wireNotices(box){
  $$('[data-notice]', box).forEach(t => t.oninput = () => {
    const k = t.dataset.notice;
    App.notices[k] = t.value;
    $$('[data-notice="' + k + '"]', box).forEach(o => { if(o !== t) o.value = t.value; });
    /* Typing here is what makes this grade its own notice, so say so at once. */
    paintNoticeSrc(box, k);
    refitSheet(t);
    clearJobDocuments();
    clearTimeout(t._timer);
    t._timer = setTimeout(() => saveNotices(), 500);
  });

  /* Delegated on the box, because paintNoticeSrc() replaces this button's
     markup and a directly assigned onclick would go with it. */
  box.addEventListener('click', e => {
    const b = e.target && e.target.closest ? e.target.closest('[data-notice-reset]') : null;
    if(!b || !box.contains(b)) return;
    /* Dropping the override puts this grade back on the school-wide notice. */
    const k = b.dataset.noticeReset;
    delete App.notices[k];
    const shared = noticeFor(k);
    $$('[data-notice="' + k + '"]', box).forEach(o => {
      o.value = shared; fitOneTextarea(o);
    });
    paintNoticeSrc(box, k);
    clearJobDocuments();
    saveNotices();
    toast('This grade now uses the school notice.');
  });
}

/** Gap between the best and weakest subject mean. */
function spread(rows, subs){
  const vals = subs.map(x => rows.map(c => c.pct[x.name]).filter(v => v !== null))
                   .reduce((a, v) => a.concat(v), []);
  if(vals.length < 2) return null;
  return r1(Math.max.apply(null, vals) - Math.min.apply(null, vals));
}
/** How many learners are approaching (or below) expectations. */
function needSupport(rows){
  return rows.filter(c => {
    if(c.average === null) return false;
    const k = category(c.average);
    return k === 'AE' || k === 'BE';
  }).length;
}
function fullyMarked(rows){
  const n = App.settings.subjects.length;
  return rows.filter(c => c.count === n).length;
}
function categorySplit(rows){
  const d = {EE:0, ME:0, AE:0, BE:0};
  rows.forEach(c => { const k = category(c.average); if(k) d[k]++; });
  return d;
}

/**
 * Inline SVG charts. No libraries, no network: everything is drawn from
 * the marks already on screen, so they print and work offline.
 */
function barChart(data, mean){
  const usable = data.filter(d => d.v !== null);
  if(!usable.length) return '<p class="hint">No marks yet, so there is nothing to chart.</p>';
  const max = Math.max.apply(null, usable.map(d => d.v).concat([mean || 0]));
  const scale = Math.max(100, Math.ceil(max / 10) * 10);
  const W = 760, rowH = 30, padL = 168, padR = 58;
  const H = usable.length * rowH + 30;
  const x = v => padL + (Math.max(0, Math.min(scale, v)) / scale) * (W - padL - padR);
  const ticks = [0, 25, 50, 75, 100].filter(t => t <= scale);
  return `<div class="tw"><svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img"
    aria-label="Class mean per subject">
    ${ticks.map(t => `<line x1="${x(t).toFixed(1)}" y1="14" x2="${x(t).toFixed(1)}" y2="${H - 12}"
        stroke="#d5dae0" stroke-width="1"/>
      <text x="${x(t).toFixed(1)}" y="${H - 2}" font-size="10" fill="#6b7280" text-anchor="middle">${t}</text>`).join('')}
    ${mean !== null && mean !== undefined ? `<line x1="${x(mean).toFixed(1)}" y1="14" x2="${x(mean).toFixed(1)}"
        y2="${H - 12}" stroke="#0f5132" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="${x(mean).toFixed(1)}" y="11" font-size="10" fill="#0f5132" text-anchor="middle">class mean ${fx(mean,1)}%</text>` : ''}
    ${usable.map((d,i) => {
      const y = 18 + i * rowH;
      const col = {EE:'#15803d', ME:'#2563eb', AE:'#d97706', BE:'#b91c1c'}[category(d.v)] || '#6b7280';
      const w = Math.max(1, x(d.v) - padL);
      return `<text x="${padL - 8}" y="${y + 11}" font-size="11" fill="#1f2937" text-anchor="end">${esc(shortName(d.k))}</text>
        <rect x="${padL}" y="${y}" width="${w.toFixed(1)}" height="15" fill="${col}" rx="2"/>
        <text x="${(padL + w + 6).toFixed(1)}" y="${y + 12}" font-size="10.5" fill="#374151">${fx(d.v,1)}% ${abbrOf(d.v)}</text>`;
    }).join('')}
  </svg></div>`;
}
/** Doughnut of the four CBE categories, drawn as an SVG pie. */
function pieChart(d){
  const tot = d.EE + d.ME + d.AE + d.BE;
  if(!tot) return '<p class="hint">No graded learners yet.</p>';
  const R = 68, r = 40, cx = 88, cy = 88;
  const cols = {EE:'#15803d', ME:'#2563eb', AE:'#d97706', BE:'#b91c1c'};
  let a = -Math.PI / 2;
  const parts = [];
  ['EE','ME','AE','BE'].forEach(k => {
    if(!d[k]) return;
    const sweep = d[k] / tot * Math.PI * 2;
    const a2 = a + sweep;
    const big = sweep > Math.PI ? 1 : 0;
    const p = (rad, ang) => [(cx + rad * Math.cos(ang)).toFixed(2), (cy + rad * Math.sin(ang)).toFixed(2)];
    const [x1,y1] = p(R, a), [x2,y2] = p(R, a2), [x3,y3] = p(r, a2), [x4,y4] = p(r, a);
    parts.push(`<path d="M ${x1} ${y1} A ${R} ${R} 0 ${big} 1 ${x2} ${y2} L ${x3} ${y3} A ${r} ${r} 0 ${big} 0 ${x4} ${y4} Z"
      fill="${cols[k]}" stroke="#fff" stroke-width="1.5"/>`);
    a = a2;
  });
  return `<svg viewBox="0 0 176 176" width="176" height="176" role="img" aria-label="CBE category split">
    ${parts.join('')}
    <text x="${cx}" y="${cy - 2}" text-anchor="middle" font-size="22" font-weight="700" fill="#0f5132">${tot}</text>
    <text x="${cx}" y="${cy + 15}" text-anchor="middle" font-size="10" fill="#6b7280">learners</text>
  </svg>`;
}
/** Column chart of how many learners sit in each 10% band. */
function histogram(rows){
  const bands = [];
  for(let b = 0; b < 100; b += 10) bands.push({lo:b, hi:b + 10, n:0});
  bands.push({lo:100, hi:100, n:0});
  rows.forEach(c => {
    if(c.average === null) return;
    const i = c.average >= 100 ? 9 : Math.floor(c.average / 10);
    bands[i].n++;
  });
  const tot = bands.reduce((a,b) => a + b.n, 0);
  if(!tot) return '<p class="hint">No averages to chart yet.</p>';
  const W = 760, H = 170, padB = 34, padT = 14;
  const max = Math.max.apply(null, bands.map(b => b.n)) || 1;
  const bw = (W - 20) / bands.length;
  return `<div class="tw"><svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img"
    aria-label="Distribution of learner averages">
    <line x1="8" y1="${H - padB}" x2="${W - 8}" y2="${H - padB}" stroke="#9ca3af"/>
    ${bands.map((b,i) => {
      const h = Math.round(b.n / max * (H - padB - padT));
      const x = 10 + i * bw + 3, y = H - padB - h;
      const col = {EE:'#15803d', ME:'#2563eb', AE:'#d97706', BE:'#b91c1c'}[category(b.lo + 5)] || '#9ca3af';
      return `<rect x="${x.toFixed(1)}" y="${y}" width="${(bw - 6).toFixed(1)}" height="${h}" fill="${col}" rx="2"/>
        <text x="${(x + (bw - 6) / 2).toFixed(1)}" y="${y - 3}" font-size="10" fill="#374151" text-anchor="middle">${b.n || ''}</text>
        <text x="${(x + (bw - 6) / 2).toFixed(1)}" y="${H - padB + 12}" font-size="9" fill="#6b7280" text-anchor="middle">${b.lo}</text>`;
    }).join('')}
    <text x="${W / 2}" y="${H - 6}" font-size="10" fill="#6b7280" text-anchor="middle">Average percentage band (%)</text>
  </svg></div>`;
}
/** Class mean for each paper, as a connected line. */
function lineChart(progress){
  const pts = progress.filter(p => p.mean !== null);
  if(pts.length < 2) return '<p class="hint">At least two exams with marks are needed for a trend line.</p>';
  const W = 760, H = 190, padL = 44, padR = 16, padT = 16, padB = 52;
  const x = i => padL + (i / (pts.length - 1)) * (W - padL - padR);
  const y = v => padT + (1 - Math.max(0, Math.min(100, v)) / 100) * (H - padT - padB);
  const ticks = [0, 25, 50, 75, 100];
  return `<div class="tw"><svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img"
    aria-label="Class mean across exams">
    ${ticks.map(t => `<line x1="${padL}" y1="${y(t).toFixed(1)}" x2="${W - padR}" y2="${y(t).toFixed(1)}"
        stroke="#e5e7eb"/>
      <text x="${padL - 6}" y="${(y(t) + 3).toFixed(1)}" font-size="10" fill="#6b7280" text-anchor="end">${t}</text>`).join('')}
    <polyline fill="none" stroke="#0f5132" stroke-width="2"
      points="${pts.map((p,i) => x(i).toFixed(1) + ',' + y(p.mean).toFixed(1)).join(' ')}"/>
    ${pts.map((p,i) => {
      const col = {EE:'#15803d', ME:'#2563eb', AE:'#d97706', BE:'#b91c1c'}[category(p.mean)] || '#6b7280';
      const words = shortName(p.a.name).split(' ');
      return `<circle cx="${x(i).toFixed(1)}" cy="${y(p.mean).toFixed(1)}" r="4" fill="${col}"/>
        <text x="${x(i).toFixed(1)}" y="${(y(p.mean) - 8).toFixed(1)}" font-size="10" fill="#374151"
          text-anchor="middle">${fx(p.mean,1)}%</text>
        ${words.map((w,j) => `<text x="${x(i).toFixed(1)}" y="${H - padB + 14 + j * 11}" font-size="9"
          fill="#6b7280" text-anchor="middle">${esc(w)}</text>`).join('')}`;
    }).join('')}
  </svg></div>`;
}
/** Small multiples: every subject's mean across papers. */
function subjectTrend(progress){
  const subs = subjectNames();
  const usable = progress.filter(p => p.mean !== null);
  if(usable.length < 2) return '';
  const series = subs.map(k => ({
    k, vals: progress.map(p => {
      const rows = computedRows(p.a.id);
      return subjectMeans(rows)[k];
    })
  }));
  return `<h4 style="margin:14px 0 6px;font-size:13px">Per-subject trend across exams</h4>
  <div class="tw scroll"><table class="grid">
    <thead><tr><th>Subject</th>${progress.map(p =>
      `<th class="num">${esc(shortName(p.a.name))}</th>`).join('')}<th class="num">Change</th></tr></thead>
    <tbody>
      ${series.map(s => {
        const first = s.vals.find(v => v !== null);
        const last  = s.vals.filter(v => v !== null).pop();
        const d = (first === undefined || last === undefined || first === last) ? null : r1(last - first);
        const cells = s.vals.map(v => v === null
          ? '<td class="num"><span class="hint">—</span></td>'
          : `<td class="num">${fx(v,1)}
               <div class="bar" style="margin:2px 0 0;height:8px">
                 <div class="c${category(v) || 'BE'}" style="width:${Math.max(0,Math.min(100,v))}%"></div>
               </div></td>`).join('');
        return `<tr><td>${esc(s.k)}</td>${cells}
          <td class="num">${d === null ? '<span class="hint">—</span>'
            : d > 0 ? '<span style="color:#15803d;font-weight:700">▲ ' + fx(d,1) + '</span>'
            : '<span style="color:#b91c1c;font-weight:700">▼ ' + fx(Math.abs(d),1) + '</span>'}</td></tr>`;
      }).join('')}
    </tbody>
  </table></div>`;
}
/** Trim a long subject or paper name for a chart label. */
function shortName(s){
  const t = String(s || '');
  return t.length > 22 ? t.slice(0, 20) + '…' : t;
}
function strongestWeakest(sm){
  let best = {k:'—', v:null}, worst = {k:'—', v:null};
  subjectNames().forEach(k => {
    const v = sm[k];
    if(v === null) return;
    if(!best.v || v > best.v) best = {k, v};
    if(!worst.v || v < worst.v) worst = {k, v};
  });
  return {best, worst};
}
function exportAnalysisCSV(){
  const examId = activeExam();
  const rows = withRanks(computedRows(examId));
  const sm = subjectMeans(rows), mean = classMean(rows);
  const data = subjectNames().map(k => {
    const vals = rows.map(c => c.pct[k]).filter(v => v !== null);
    return [k, sm[k] === null ? '' : r1(sm[k]), abbrOf(sm[k]),
            vals.length ? Math.max.apply(null, vals) : '',
            vals.length ? Math.min.apply(null, vals) : '',
            vals.length ? Math.round(vals.filter(v => sm[k] !== null && v > sm[k]).length / vals.length * 100) + '%' : ''];
  });
  data.push(['OVERALL', mean === null ? '' : r1(mean), abbrOf(mean), '', '', '']);
  download('subject-analysis-' + examId + '.csv',
    toCSV(['Subject','Class Mean %','Grade','Highest %','Lowest %','Above Mean'], data), 'text/csv');
}

function findCat(id){ return App.cats.find(c => c.id === id) || null; }
async function catEditor(id){
  const c = id ? findCat(id) : null;
  const subs = subjectNames();
  /* Values are copied as they are typed, so nothing depends on the dialog
     still being on the page when it closes. */
  const snap = {

  };

  const grab = body => {
    const v = k => { const e = body.querySelector(k); return e ? e.value : ''; };
    snap.title = v('#ctTitle').trim(); snap.subject = v('#ctSub') || snap.subject;
    snap.grade = v('#ctGrade').trim(); snap.date = v('#ctDate') || today();
    snap.total = num(v('#ctTotal')) || 20; snap.teacher = v('#ctTeacher').trim();
  };
  let r = await modal({
    title: c ? 'Edit CAT details' : 'New CAT record', wide: 520,
    body: `
      <div class="grid2">
        <div class="field"><label class="fl">Title</label>
          <input id="ctTitle" type="text" value="${esc(snap.title)}" placeholder="e.g. CAT 1 – Fractions"></div>

        <div class="field"><label class="fl">Class</label>

          <input id="ctDate" type="date" value="${esc(snap.date)}"></div>
        <div class="field"><label class="fl">Out of (total marks)</label>

        <div class="field"><label class="fl">Teacher</label>
          <input id="ctTeacher" type="text" value="${esc(snap.teacher)}"></div>
      </div>
      <p class="hint why">${c ? '' : 'Press <b>Create CAT</b> to add it to the list. '}Marks are entered on the next screen — one row per learner.</p>
      ${c ? '' : '<button type="button" id="ctCreate" class="primary" style="width:100%;margin-top:8px;padding:11px;font-size:15px">✔ Create CAT</button>'}`,
    buttons: [{label:'Cancel', value:null},
              {label: c ? '💾 Save details' : '✔ Create CAT', value:'ok', cls:'primary'}],
    onOpen: (body, foot) => {
      const go = () => { grab(body); foot.lastChild.click(); };
      const b = body.querySelector('#ctCreate'); if(b) b.onclick = go;
      const mark = () => { touched = true; grab(body); };
      body.addEventListener('input', mark);
      body.addEventListener('change', mark);
      body.addEventListener('keydown', e => { if(e.key === 'Enter' && e.target.tagName === 'INPUT'){ e.preventDefault(); go(); } });
    }
  });
  /* Closing a half-filled new CAT asks before throwing it away. */
  if(r !== 'ok' && !c && touched && (snap.title || snap.total !== 20)){
    const keep = await confirmBox('This new CAT has not been created yet.<br><br>Do you want to <b>create it now</b> before closing?',
      {title:'Unsaved CAT', okLabel:'Yes, create the CAT', cancelLabel:'No, discard it'});
    if(keep) r = 'ok';
  }
  if(r !== 'ok') return null;
  const rec = c || {id:uid(), cohortId:App.settings.activeCohortId, marks:{}, createdAt:Date.now()};
  rec.title   = snap.title || 'Untitled CAT';
  rec.subject = snap.subject;
  rec.grade   = snap.grade;
  rec.date    = snap.date;
  rec.total   = snap.total;
  rec.teacher = snap.teacher;
  if(!c) App.cats.push(rec);
  let ok = false;
  try{ ok = await Store.set(DBKEY.cats, App.cats); }catch(_){ ok = false; }
  if(!ok){
    if(!c) App.cats = App.cats.filter(x => x.id !== rec.id);
    toast('The CAT could not be saved on this computer. Make a backup, free some space and try again.', {bad:true});
    return null;
  }
  return rec.id;

async function deleteCat(id){
