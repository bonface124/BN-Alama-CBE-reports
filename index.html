<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f5132">
<title>ALAMA BN CBC reports</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* ================================================================
   OFFLINE ALAMA CBE REPORTS
   Stylesheet: school-friendly, responsive, print-friendly
   ================================================================ */
:root{
  --green:#0f5132; --green2:#146c43; --lgreen:#e9f4ed; --lgreen2:#d3e9dc;
  --ink:#1f2937; --muted:#6b7280; --line:#d5dae0; --bg:#f3f5f7;
  --amber:#b45309; --red:#b91c1c; --redbg:#fde8e8; --blue:#1d4ed8;
  --radius:8px; --shadow:0 1px 3px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Segoe UI",Roboto,Calibri,Arial,sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}
a{color:var(--blue)}
h1,h2,h3,h4{margin:0 0 .5em}

#app{display:flex;min-height:100vh}
#sidebar{
  width:232px;flex:0 0 232px;background:var(--green);color:#fff;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto;
}
#sidebar .brand{padding:14px 14px 10px;border-bottom:1px solid rgba(255,255,255,.18)}
/* The name of the system, not the school: it sits above the school name and is
   kept quiet, so the school is still the loudest thing in the bar. */
#sidebar .brand .sysname{font-size:9.5px;line-height:1.3;font-weight:600;
  letter-spacing:.9px;opacity:.5;margin-bottom:3px;overflow-wrap:anywhere}
/* The school name is the heading of the app. It is deliberately the loudest
   thing in the bar, and it wraps rather than being clipped when it is long. */
#sidebar .brand span{display:block;font-size:17px;line-height:1.25;font-weight:700;
  opacity:1;letter-spacing:.2px;overflow-wrap:anywhere}
#sidebar nav{padding:8px 0;flex:1}
#sidebar a.nav{
  display:flex;align-items:center;gap:9px;padding:9px 14px;color:#eaf5ee;
  text-decoration:none;font-size:13.5px;border-left:3px solid transparent;
}
#sidebar a.nav:hover{background:rgba(255,255,255,.09)}
#sidebar a.nav.active{background:var(--green2);border-left-color:#ffd166;font-weight:600}
#sidebar a.nav .ic{width:18px;text-align:center;flex:0 0 18px}
#sidebar .sidefoot{padding:10px 14px;border-top:1px solid rgba(255,255,255,.18);font-size:11px;opacity:.85}

main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{
  background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:20;box-shadow:var(--shadow);
}
#topbar .ttl{font-weight:700;font-size:16px;color:var(--green);cursor:pointer;user-select:none;
  padding:2px 6px;margin:-2px -6px;border-radius:8px;position:relative}
/* The line under a page title is a small note, so it stays out of the way:
   it appears when the heading is hovered, or pinned open by clicking it. */
#topbar .ttl small{display:block;font-weight:400;font-size:11.5px;color:var(--muted);
  max-height:0;opacity:0;overflow:hidden}
/* Hover fades it in; clicking pins it open straight away, with no animation to
   wait for, so the note is always readable once it is pinned. */
#topbar .ttl:hover,#topbar .ttl.pin{background:#f1f7f3}
#topbar .ttl:hover small{transition:max-height .18s ease, opacity .14s ease;
  max-height:46px;opacity:1;transform:none;margin-top:3px}
#topbar .ttl.pin small,#topbar .ttl:focus small{transition:none;
  max-height:46px;opacity:1;transform:none;margin-top:3px}
#topbar .ttl.pin{outline:1px solid #cfe4d7}
/* On the Dashboard the banner lives in the page itself, above the heading, and
   the class-level toolbar is not needed. */
body.dashpage #topbar .ttl{display:none}
body.dashpage #topbar .tools{display:none}
body.dashpage #topbar{padding:0;border:0;box-shadow:none;position:static}
.dashhead{margin-bottom:2px}
.dashttl{font-weight:800;font-size:19px;color:var(--green);padding:2px 2px 12px}
.dashttl small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
#topbar .tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* ---------- The class toolbar ----------
   Four pickers and two actions, each in its own tinted chip. The tint tells
   them apart at a glance without having to read the caption, and the caption is
   bold and coloured to match its chip, so the row is legible at a glance while
   the value stays the darkest thing in the chip. Each chip carries its own
   --hue/--tint/--edge, so the colours are set once per control and reused. */
#topbar .tool{
  display:inline-flex;align-items:center;gap:7px;padding:5px 9px 5px 8px;
  border-radius:10px;background:var(--tint);border:1px solid var(--edge);
  box-shadow:0 1px 2px rgba(16,24,40,.06);
}
#topbar .tool .ti{font-size:15px;line-height:1;flex:0 0 auto}
#topbar .tool .tc{
  font-size:10px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;
  color:var(--hue);margin:0;white-space:nowrap;
}
#topbar .tool select{
  border:0;background:transparent;padding:1px 2px;font-size:13px;font-weight:700;
  color:var(--ink);box-shadow:none;max-width:200px;border-radius:6px;
}
#topbar .tool select:hover{background:rgba(255,255,255,.6)}
#topbar .tool select:focus{outline:2px solid var(--hue);outline-offset:1px;background:#fff}
#topbar .tool:focus-within{box-shadow:0 0 0 2px var(--edge)}
.t-grade{--hue:#1d4ed8;--tint:#eef2ff;--edge:#c7d2fe}
.t-class{--hue:#0f766e;--tint:#ecfdf5;--edge:#a7f3d0}
.t-term {--hue:#b45309;--tint:#fffbeb;--edge:#fde68a}
.t-exam {--hue:#7c3aed;--tint:#f5f3ff;--edge:#ddd6fe}
/* Backup and Restore are actions, not values, so they read as solid buttons
   and are the only saturated things in the row. */
#topbar .toolbtn{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:10px;
  font-size:13px;font-weight:700;cursor:pointer;border:1px solid transparent;
}
#topbar .toolbtn .ti{font-size:14px;line-height:1}
#topbar .toolbtn.bak{background:linear-gradient(180deg,#16a34a,#15803d);color:#fff;
  border-color:#14532d;box-shadow:0 2px 6px rgba(16,64,32,.28)}
#topbar .toolbtn.bak:hover{background:linear-gradient(180deg,#22c55e,#16a34a)}
#topbar .toolbtn.res{background:#fff;color:#1e40af;border-color:#bfdbfe;
  box-shadow:0 1px 3px rgba(16,24,40,.12)}
#topbar .toolbtn.res:hover{background:#eff6ff;border-color:#93c5fd}
#topbar .toolbtn:focus-visible{outline:2px solid var(--green2);outline-offset:2px}
#view{padding:16px;flex:1}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px}
.card>h3{padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px;margin:0;font-weight:700;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
/* Clicking a heading, such as "School at a glance", marks that card so you
   can see which part of the page you are reading. */
.card>h3.pick{cursor:pointer;border-radius:var(--radius) var(--radius) 0 0;transition:background .13s}
.card>h3.pick:hover{background:#eef4f0}
.card>h3.pick::after{content:'●';font-size:9px;color:rgba(255,255,255,.5);margin-left:auto;flex:0 0 auto}
.card.on{outline:2px solid var(--green);outline-offset:2px;box-shadow:0 0 0 4px #dceae2}
.card.on>h3{background:
    repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 9px,rgba(255,255,255,0) 9px 18px),
    linear-gradient(120deg,#17734a 0%,#1d8f63 100%)}
.card.on>h3::before{background:linear-gradient(180deg,#ffd166,#f59e0b)}
.card.on>h3.pick::after{content:'●';color:#ffd166}
.card .bd{padding:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.spacer{flex:1}

button{font:inherit;font-size:13.5px;padding:7px 13px;border-radius:6px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);transition:.12s}
button:hover{border-color:var(--green2);color:var(--green)}
button.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
button.primary:hover{background:var(--green2);color:#fff}
button.danger{background:var(--red);border-color:var(--red);color:#fff}
button.sm{padding:4px 8px;font-size:12px}
button:disabled{opacity:.5;cursor:not-allowed}

input,select,textarea{font:inherit;font-size:13.5px;padding:6px 8px;border:1px solid #c3cad2;border-radius:6px;background:#fff;color:var(--ink);max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green2);outline-offset:-1px;border-color:var(--green2)}
input[readonly]{background:#f4f6f8}
label.fl{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:3px}
.field{margin-bottom:10px}
/* The School Notice card: the words as they will print, then a plain text box. */
.notice-paper{
  border:1px solid var(--line);border-left:4px solid var(--green);border-radius:6px;
  background:var(--lgreen);padding:11px 13px;font-size:13.5px;line-height:1.55;
  white-space:pre-wrap;color:var(--ink);min-height:44px;
}
.notice-none{color:var(--muted);font-style:italic}
#noticeBody textarea{width:100%;min-height:96px;resize:vertical;line-height:1.5;display:block;margin-bottom:2px}
#noticeEdit{white-space:nowrap}
.hint{font-size:11.5px;color:var(--muted)}

table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:middle}
th{background:var(--lgreen);font-weight:700;color:#0b3d26}
thead th{white-space:nowrap}
tbody tr:nth-child(even){background:#fafcfb}
td.num,th.num{text-align:center}
.scroll{overflow:auto;max-height:70vh}
.tw{overflow-x:auto}

.stat{background:#fff;border:1px solid var(--line);border-left:5px solid var(--green2);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.stat .v{font-size:26px;font-weight:800;color:var(--green);line-height:1.1}
.stat .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stat .s{font-size:12px;color:#374151;margin-top:2px}
.navcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.navcard{display:block;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:.14s}
.navcard:hover{border-color:var(--green2);transform:translateY(-2px)}
.navcard .ic{font-size:22px}
.navcard b{display:block;color:var(--green);font-size:13.5px}
.navcard span{font-size:11.5px;color:var(--muted)}
.bar{display:flex;height:20px;border-radius:5px;overflow:hidden;background:#e5e7eb;margin:6px 0}
.bar>div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;min-width:2px}
.cEE{background:#15803d}.cME{background:#2563eb}.cAE{background:#d97706}.cBE{background:#b91c1c}
/* Raw marks page: one cell per learner, so a weak row is spotted while typing. */
.heat{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 2px}
.heat>div{width:26px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:10.5px;font-weight:700}
.heat>div.blank{background:#fff;border:1px dashed #c3c9cf;color:#9aa1a8}
.heatlg{display:flex;flex-wrap:wrap;gap:14px;margin:10px 0 0;font-size:11.5px;color:var(--muted);align-items:center}
.heatlg span{display:flex;align-items:center;gap:6px}
.heatlg b{width:11px;height:11px;border-radius:3px;display:inline-block}
.total-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--green);
  background:var(--lgreen);border:1px solid var(--lgreen2);border-radius:20px;padding:4px 12px;cursor:pointer}
.total-btn:hover{background:#dcefe4}
.total-btn .q{width:15px;height:15px;flex:0 0 15px;border-radius:50%;background:var(--green);color:#fff;
  font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.total-btn[aria-expanded="true"]{background:var(--lgreen2);box-shadow:0 0 0 2px #9fc7b1 inset}
/* A long school name must not break across lines inside its own pill, and the
   exam total must never wrap: the row moves whole pills instead. */
#rawPills > span.pill{white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
#rawPills > .total-btn{white-space:nowrap;flex:0 0 auto}
.pop{position:fixed;z-index:95;background:#fff;border:1px solid var(--line);border-left:5px solid var(--green2);
  border-radius:8px;box-shadow:0 6px 18px rgba(15,81,50,.16);padding:10px 12px;max-width:300px;
  font-size:12.5px;line-height:1.5}
.pop b{color:var(--green)}
.pop p{margin:0 0 6px}
.pop p:last-child{margin:0}
/* A card heading can carry its own explanation: click the title, read it here. */
.hdbtn{display:inline-flex;align-items:center;gap:7px;background:none;border:0;padding:0;margin:0;
  font:inherit;font-weight:inherit;color:inherit;text-align:left;cursor:pointer}
.hdbtn:hover{text-decoration:underline;text-underline-offset:3px}
.hdbtn .q{width:16px;height:16px;flex:0 0 16px;border-radius:50%;background:var(--green);color:#fff;
  font-size:10.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;
  text-decoration:none}
.hdbtn:hover .q{background:var(--green2)}
.hdbtn[aria-expanded="true"]{background:var(--lgreen);border-radius:6px;padding:1px 7px 1px 5px}
.alert{background:#fff7ed;border:1px solid #fdba74;border-left:5px solid var(--amber);padding:10px 12px;border-radius:6px;font-size:13px;margin-bottom:10px}
.alert.bad{background:var(--redbg);border-color:#f0a5a5;border-left-color:var(--red)}

table.grid input,table.grid select{padding:3px 5px;font-size:13px;width:100%;min-width:52px}
table.grid input[type=text]{min-width:170px}
table.grid td{padding:2px 3px}
table.grid input.bad{background:var(--redbg);border-color:var(--red);color:var(--red);font-weight:700}
table.grid input:focus{outline:2px solid var(--green2);outline-offset:-2px}

/* ---------- Report sheets: one set of sizes for screen and paper ----------
   These rules are the ONLY place the sheet is measured. They used to live in
   @media print, which made the printed report smaller than the one on screen.
   Now the preview already carries the print metrics, so what the teacher reads
   on the dashboard is exactly what comes out of the printer. */
/* Bottom-left of every sheet. The sheet is a column so the footer's auto
   margin drops it into the blank space at the foot of the page. */
.report-sheet{background:#fff;width:210mm;min-height:296mm;margin:0 auto;padding:10mm;box-shadow:0 2px 10px rgba(0,0,0,.15);color:#000;
  display:flex;flex-direction:column;overflow:hidden}
.rpt-head{display:flex;align-items:center;gap:9px;border-bottom:2px solid var(--green);padding-bottom:4px}
.rpt-head img{max-width:52px;max-height:52px;object-fit:contain}
.rpt-head .ht{flex:1;text-align:center}
.rpt-head .ht .s1{font-size:15px;font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:.5px}
.rpt-head .ht .s2{font-size:11.5px;font-weight:700;text-transform:uppercase;margin-top:2px}
.rpt-head .ht .s3{font-size:9.5px;font-style:italic;margin-top:2px}
.rpt-head .ht .s3 + .s3{margin-top:0}
.rpt-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px 8px;margin:5px 0;font-size:11px}
.rpt-meta b{display:block;font-size:9.5px;letter-spacing:.06em;color:#555;text-transform:uppercase}
.rpt-meta span{border-bottom:1px dotted #999;display:block;padding:0 2px;min-height:15px}
table.rpt{width:100%;font-size:10px;margin-top:0}
table.rpt th,table.rpt td{border:1px solid #444;padding:1.5px 3px}
table.rpt th{background:#d9e8df;text-align:center;font-size:8.5px;line-height:1.2;text-transform:uppercase}
table.rpt td.c{text-align:center}
.totrow td{background:#eef4f0;font-weight:700}
.ayanote{font-size:8.5px;text-align:center;margin:0 0 3px;padding:2px;border:1px dashed #666}
.rpt-two{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:4px;overflow:hidden}
.rpt-box{border:1px solid #444;padding:3px 5px;font-size:9px;line-height:1.3;overflow:hidden}
.rpt-box h4{margin:0 0 1px;font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:#0b3d26}
.rpt-box table{border:0}
.rpt-box td{border:0;padding:0 3px 0 0}
.legend{width:100%;font-size:8px;margin-top:2px}
.legend th,.legend td{border:1px solid #666;padding:1px 2px}
.legend th{background:#e3ece7;font-size:7.5px;text-transform:uppercase}
.report-sheet h4{font-size:9.5px!important;margin:4px 0 1px!important}
.remarks{border:1px solid #444;padding:4px 6px;margin-top:8px;font-size:12px;line-height:1.45;white-space:pre-wrap;overflow:hidden}
.remarks textarea{width:100%;border:0;min-height:64px;max-height:210px;font:inherit;font-size:12px;line-height:1.45;resize:vertical;padding:0;overflow-x:hidden;overflow-y:auto;scrollbar-width:thin}
/* Remarks and the notice are the two parts of the sheet a human actually reads,
   so both are set larger than the tables and figures around them. The notice
   leads, because it is the one written for the parent at home. */
.remarks.notice{font-size:13px;line-height:1.5}
.remarks.notice textarea{min-height:56px;max-height:140px;font-size:13px;line-height:1.5}
.report-sheet h4.rem-h,.report-sheet h4.notice-h{font-size:11.5px!important;margin:10px 0 3px!important;letter-spacing:.02em}
/* Where the printed notice came from: only shown when this grade has its own. */
.notice-src{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:5px}
.notice-src.empty{display:none}
.notice-tag{font-size:10.5px;color:var(--amber);font-weight:700}
.notice-reset{
  font-size:10.5px;padding:1px 7px;border:1px solid var(--line);border-radius:10px;
  background:#fff;color:var(--green);cursor:pointer;font-weight:600;
}
.notice-reset:hover{background:var(--lgreen);border-color:var(--green2)}
/* ---------- Signatures: name, then the place to sign ---------- */
.sig{display:grid;grid-template-columns:repeat(2,1fr);gap:28px;margin-top:16px;font-size:11.5px;text-align:center;overflow:hidden}
.sig .sigcell{display:flex;flex-direction:column;align-items:center;overflow:hidden}
.sig .sn{font-size:11.5px;font-weight:700;color:#000;min-height:15px;line-height:1.3}
.sig .sigbox{
  width:100%;height:42px;border-bottom:1px solid #000;margin:2px 0 3px;
  display:flex;align-items:flex-end;justify-content:center;
}
.sig .sigbox img{max-height:40px;max-width:92%;object-fit:contain;object-position:bottom}
.sig .scap{font-size:9.5px;color:#333}
/* On the sheet itself the signature block is trimmed to the paper metrics. */
.report-sheet .sig{margin-top:8px;font-size:9.5px;gap:16px;overflow:hidden}
.report-sheet .sig .sn{font-size:9.5px;min-height:13px}
.report-sheet .sig .sigbox{height:32px;margin:1px 0 2px}
.report-sheet .sig .sigbox img{max-height:30px}
.report-sheet .sig .scap{font-size:8px}
/* Grades 7-9 carry nine subjects instead of five. The sheet is tightened
   so a nine-subject report still fills exactly one A4 page. */
.report-sheet.wide .rpt-head .ht .s1{font-size:14px}
.report-sheet.wide .rpt-meta{font-size:10px;margin:3px 0}
.report-sheet.wide .rpt-meta span{min-height:13px}
.report-sheet.wide .who{margin:2px 0 1px;padding:3px 8px}
.report-sheet.wide .who .nm{font-size:13px}
.report-sheet.wide .who .no{font-size:13px}
.report-sheet.wide .who .gr{font-size:12px}
.report-sheet.wide .who .sm{font-size:9.5px}
.report-sheet.wide table.rpt{font-size:9px}
.report-sheet.wide table.rpt th,.report-sheet.wide table.rpt td{padding:1px 2px}
.report-sheet.wide table.rpt th{font-size:7.5px}
.report-sheet.wide .rpt-box{padding:2px 4px;font-size:8.5px;line-height:1.25}
.report-sheet.wide .legend th{font-size:7px}
/* A wide sheet shrinks its tables and figures to fit, but the remarks and the
   notice are read rather than scanned, so they keep the same size as on a
   narrow sheet — the teacher should not have to hunt for them. */
.report-sheet.wide .remarks{padding:3px 5px;font-size:12px;line-height:1.45}
.report-sheet.wide .remarks textarea{min-height:66px;max-height:195px;font-size:12px!important;line-height:1.45}
.report-sheet.wide .remarks.notice{font-size:13px;line-height:1.5}
.report-sheet.wide .remarks.notice,
.report-sheet.wide .remarks.notice textarea{min-height:50px;max-height:136px;font-size:13px!important;line-height:1.5}
.report-sheet.wide .sig{margin-top:6px;overflow:hidden}

.dbar{display:flex;align-items:center;gap:10px;padding:4px 0}

.popbar .dbart{height:14px}
.popbar .dbarn{width:210px}

.dethd{font-size:14.5px;font-weight:800;color:var(--green);margin-bottom:9px;

.dethd small{display:block;font-weight:400;font-size:11.5px;color:var(--muted);margin-top:2px}
.detsub{font-size:11px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:#6b7280;
  margin:12px 0 6px}
.detlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:#4b5563;margin-bottom:6px}
.detlegend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;
  vertical-align:-1px}
.kpi-ic{font-size:19px;line-height:1;display:block}
.kpi-l{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:#6b7280;margin-top:7px;font-weight:700;display:block}
.kpi-v{font-size:25px;font-weight:800;color:#14261d;line-height:1.15;margin-top:1px;display:block}
.kpi-s{font-size:11.5px;color:#6b7280;margin-top:2px;display:block}
.gapgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:11px}
.gapbox{background:#fffdf6;border:1px solid #fde68a;border-radius:9px;overflow:hidden}
.gapsum{cursor:pointer;list-style:none;padding:10px 13px;display:flex;align-items:baseline;gap:9px;
  background:#fef3c7;font-weight:700}

.gapbox[open] .gapsum::after{transform:rotate(180deg)}

.gapg{font-size:13.5px;color:#92400e}
.gapc{font-size:17px;font-weight:800;color:#b45309;line-height:1}
.gapt{font-size:11px;color:#a16207;font-weight:600}
.gapnames{padding:8px 13px 11px;display:flex;flex-direction:column;gap:4px;

.gapname{font-size:12.5px;color:#44403c;display:flex;justify-content:space-between;align-items:center;gap:8px;
  width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:4px 6px;cursor:pointer;font-family:inherit}
.gapname:hover{background:#fef3c7;color:#92400e}
.gapname:focus-visible{outline:2px solid #b45309;outline-offset:1px}
tr.saved{background:#dcf5e5!important;box-shadow:inset 3px 0 0 #15803d}
.gapname em{font-style:normal;font-size:11px;color:#a16207;font-weight:700;flex:0 0 auto;white-space:nowrap}
.tr.flash{background:#fde68a!important;box-shadow:inset 3px 0 0 #b45309}
@media print{.kpi-s{color:#555}}
td.num.warn,th.num.warn{background:#fef3c7;font-weight:700;color:#92400e}
table th.maxrow th{background:var(--lgreen2);font-size:11px;font-weight:700;color:#0b3d26}

}

table.grid tr.maxrow td{background:#f2f7f4}
.grade-EE1,.grade-EE2{background:#15803d}

.ovl{position:fixed;inset:0;background:rgba(15,25,18,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
/* The saved PDF is shown in the browser's own reader, so what is on screen
   here is exactly what lands in the folder. The waiting state keeps the same
   shape, so the page does not jump when the file arrives. */
.pdfview{width:100%;height:min(74vh,940px);border:1px solid var(--line);border-radius:8px;background:#4a4f55;display:block}
.pdfwait{height:min(74vh,940px);border:1px solid var(--line);border-radius:8px;background:#f5f8f6;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#4b5a52;font-size:14px;text-align:center;padding:16px}
.pdfwait b{color:var(--green)}
.pdfspin{width:26px;height:26px;border:3px solid #d3e9dc;border-top-color:var(--green2);border-radius:50%;
  animation:pdfspin .8s linear infinite}
@keyframes pdfspin{to{transform:rotate(360deg)}}
.dlg{background:#fff;border-radius:10px;max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.dlg .dh{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;color:var(--green);display:flex;justify-content:space-between;align-items:center}

.toast{background:#111827;color:#fff;padding:10px 13px;border-radius:7px;font-size:13px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.toast button{background:#fff;color:#111827;border:0;font-weight:700;padding:3px 8px;font-size:12px}

#lock{position:fixed;inset:0;background:linear-gradient(160deg,var(--green),#063);z-index:300;display:flex;align-items:center;justify-content:center;overflow:auto;padding:12px 0}
#lock .lc{background:#fff;border-radius:12px;padding:22px 24px;width:min(560px,calc(100vw - 20px));text-align:center;box-shadow:0 16px 50px rgba(0,0,0,.4);margin:auto}

/* ---------- Colourful dashboard ---------- */
.hero{
  border-radius:14px;padding:16px 18px;margin-bottom:16px;color:#fff;
  background:linear-gradient(120deg,#0f5132 0%,#146c43 38%,#1d7a4f 60%,#0e7490 100%);
  box-shadow:0 6px 20px rgba(15,81,50,.28);position:relative;overflow:hidden
}
.hero::after{
  content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,209,102,.35),rgba(255,209,102,0) 70%)
}
.hero h3{color:#fff;margin:0 0 2px;font-size:19px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hero .sub{font-size:12.5px;opacity:.94;margin-bottom:12px}
.hero .row{position:relative;z-index:1}
.hero label.fl{color:#eafaf1}
.hero select,.hero input{background:#fff;color:#0f5132}
/* The grade picker must never be squeezed by the crowded button row — grid
   cells keep a floor width so all nine grade labels stay readable. */
.hero .row.sel{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));
  gap:12px;align-items:end;
}
.hero .row.sel>div{min-width:0}
.hero .row.sel select,.hero .row.sel input{width:100%;max-width:100%}
/* Long labels must wrap rather than push the grid wider than the card. */
.hero .row.sel button{
  width:100%;min-width:0;white-space:normal;line-height:1.3;overflow-wrap:anywhere;
}
@media (max-width:640px){
  .hero .row.sel{grid-template-columns:repeat(auto-fit,minmax(132px,1fr))}
}
.hero button{background:#fff;color:#0f5132;border-color:#fff;font-weight:600}
.hero button:hover{background:#ffd166;border-color:#ffd166;color:#0f5132}
/* The Home page is built from plain cards, so these grids and form rows are
   shared outside the hero as well. */
.row.sel{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;align-items:end}
.row.sel>div{min-width:0}
.row.sel select,.row.sel input{width:100%;max-width:100%}
.row.sel button{width:100%;min-width:0;white-space:normal;line-height:1.3;overflow-wrap:anywhere}
@media (max-width:640px){
  .row.sel{grid-template-columns:repeat(auto-fit,minmax(132px,1fr))}
}
/* School logo beside the school name. One shared size so it reads the same

  background:#fff;border-radius:8px;padding:3px;flex:0 0 auto}

  font-size:21px;flex:0 0 auto;border:1px solid rgba(255,255,255,.28)}

             radial-gradient(circle at 70% 120%,rgba(45,212,191,.22),transparent 46%)}
.homehead .bd{position:relative;z-index:1}
.homeschool{font-size:23px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.25);line-height:1.15}
.homesub{font-size:13.5px;color:#d7f0e2;margin-top:5px}
.homechips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* The Dashboard and Home set the tone; these rules give Grades, Class List,

   calm, green-accented look. Everything here is cancelled again for printing. */
#view{max-width:1560px;width:100%}
#topbar{background:linear-gradient(180deg,#ffffff 0%,#f6faf8 100%)}
#sidebar{background:linear-gradient(180deg,#0f5132 0%,#0b4227 100%)}

#sidebar a.nav.active{background:rgba(255,255,255,.14)}

.card{border-radius:14px;border-color:#e3e8ee;

.card:hover{border-color:#d3e3d9;box-shadow:0 2px 4px rgba(16,24,40,.06),0 18px 38px rgba(16,24,40,.09)}
.card>h3{padding:13px 16px;font-size:14.5px;letter-spacing:.1px;position:relative;color:#fff;
  background:
    repeating-linear-gradient(135deg,rgba(255,255,255,.055) 0 9px,rgba(255,255,255,0) 9px 18px),
    radial-gradient(130% 170% at 100% 0%,rgba(45,212,191,.34) 0%,rgba(45,212,191,0) 58%),
    linear-gradient(120deg,#0f5132 0%,#12704a 55%,#0d5a3c 100%);
  border-bottom:1px solid #0b4227;text-shadow:0 1px 1px rgba(0,0,0,.20)}
.card>h3::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,#ffd166,#2dd4bf)}
.card>h3.pick:hover{background:
    repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 9px,rgba(255,255,255,0) 9px 18px),

.card>h3>span{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.card .bd{padding:16px}
.card>h3 button.primary{background:linear-gradient(180deg,#ffffff,#e9f4ee);color:#0f5132;
  border-color:#fff;box-shadow:0 2px 9px rgba(4,32,20,.35)}
.card>h3 button.primary:hover{background:linear-gradient(180deg,#ffffff,#dff0e6)}
/* Controls sitting in a coloured heading keep their own light background, so the
   heading text shadow must not follow them into it. */
.card>h3 button,.card>h3 input,.card>h3 select,.card>h3 .hint{text-shadow:none}
.card>h3 .hint{color:rgba(255,255,255,.85)}
.card>h3 .hdbtn .q{background:rgba(255,255,255,.24);border:1px solid rgba(255,255,255,.45)}
.card>h3 .hdbtn:hover .q{background:rgba(255,255,255,.38)}
.card>h3 .hdbtn[aria-expanded="true"]{background:rgba(255,255,255,.2)}
/* Explanatory notes are folded away so a page reads as headings and figures.
   Clicking a heading opens its note; a card holding nothing but notes closes up
   to just its heading bar. */
.card>.bd>p.hint.why{display:none}
#view .card p.hint.why{display:none}
#view .card.whyopen p.hint.why{display:block}
#view .card .report-sheet p.hint.why{display:block}
.card.whyopen>.bd>p.hint.why:first-child{margin-top:0}
.card>.bd:not(:has(> *:not(p.hint.why))){display:none}
.card.whyopen>.bd:not(:has(> *:not(p.hint.why))){display:block}
.card:has(p.hint.why)>h3{cursor:pointer}
.card:has(p.hint.why)>h3:hover{text-decoration:underline;text-decoration-offset:3px}
.card:has(p.hint.why)>h3:not(:has(button))::after,
.card:has(p.hint.why)>h3:has(button)>span:not(.hint)::after{
  content:"?";width:17px;height:17px;flex:0 0 17px;border-radius:50%;
  background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.5);color:#fff;
  font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;
  margin-left:auto;text-shadow:none;transition:background .13s}
.card:has(p.hint.why)>h3:has(button)>span:not(.hint)::after{margin-left:0}
.card.whyopen:has(p.hint.why)>h3:not(:has(button))::after,
.card.whyopen:has(p.hint.why)>h3:has(button)>span:not(.hint)::after{
  background:#fff;border-color:#fff;color:var(--green)}
/* Fallback signal that does not depend on the badge winning a cascade: the
   accent bar turns white while the note is open. */
.card.whyopen>h3::before{background:linear-gradient(180deg,#ffd166,#ffffff)}

/* ---------- Settings sections with a summary ----------
   A settings card shows a few telling facts under its heading, and keeps the
   full form behind a "View more" tab. The heading is a plain label: there is
   no dropdown, so nothing on the card hides behind a click on the bar. */
.card.sec:not(.sec-more)>.bd{display:none}
/* Most of these cards have no dropdown, so their heading must not look
   clickable. The app gives any card holding a "why" note a pointer heading
   and a "?" badge, both of which used to mean "click to read the note". The
   #view prefix is needed to outrank those rules, which are written the same
   way. A sec-pop card keeps a live heading, so it is left alone. */
#view .card.sec:not(.sec-pop)>h3{cursor:default}
#view .card.sec:not(.sec-pop)>h3:hover{text-decoration:none}
#view .card.sec:not(.sec-pop):has(p.hint.why)>h3::after,
#view .card.sec:not(.sec-pop):has(p.hint.why)>h3>span:not(.hint)::after{display:none}
/* A sec-pop heading still opens its popover, so it stays a live target. */
#view .card.sec-pop>h3{cursor:pointer}
/* The note belongs to the form, so it arrives with it rather than behind the
   heading — that also keeps the card's accent bar in its normal colour. */
#view .card.sec.sec-more>.bd>p.hint.why{display:block}
#view .card.sec.sec-more>.bd>p.hint.why:first-child{margin-top:0}

@page{size:A4 portrait;margin:10mm}
/* The date and time at the top of a printed page are the browser's own print
   header, and a header is only drawn when the page margin has room for one.
   Report sheets therefore ask for a named page with no margin and carry the
   10mm white border themselves, so nothing is drawn above the school name.
   Browsers that do not know named pages ignore this and fall back to @page. */
@page sheet{size:A4 portrait;margin:0}
@media print{
  html,body{background:#fff}
  #sidebar,#topbar,.no-print,#toasts,.ovl,#lock{display:none!important}
  #app{display:block;min-height:0}
  #view{padding:0}
  .card{box-shadow:none;border:0;margin:0;padding:0}
  .card:hover{border-color:transparent;box-shadow:none}
  .card>h3{display:none}
  .card .bd{padding:0}
  button{box-shadow:none}
  button:hover{transform:none;box-shadow:none}
  tbody tr:hover{background:inherit}
  .scroll thead th{position:static}
  .hero{box-shadow:none}
  .scroll,.tw{max-height:none;overflow:visible}
  /* Printing a CAT record starts at its preview: the list of records and the
     page where marks are keyed are working pages, not part of the record. The
     preview may still be folded away on screen, so printing unfolds it. */
  body.catprinting #view > *:not(#catSheet){display:none!important}
  body.catprinting #catSheet > *:not(#catPreviewCard){display:none!important}
  body.catprinting #catPreviewCard{display:block!important}
  /* The sheet keeps its own metrics (see the report block above). On paper the
     page margin is taken away so the browser draws no header, so the sheet
     supplies that margin itself and stays exactly one A4 page per learner. */
  .report-sheet{page:sheet;width:210mm;min-height:296mm;margin:0 auto;padding:10mm;
    box-shadow:none;page-break-after:always}
  .report-sheet:last-child{page-break-after:auto}
  /* Page numbers sit where the class teacher used to sign. */
  .pagefoot{
    display:block;position:fixed;left:0;right:0;bottom:0;text-align:center;
    font-size:9.5px;color:#111;padding-top:3px;
  }
  .pagefoot .pn:after{content:"Page " counter(page)}
  thead{display:table-header-group}
  tr{page-break-inside:avoid}
  a[href]:after{content:""}
}

<script>
"use strict";
/* ==================================================================
   OFFLINE ALAMA CBE REPORTS
   A single, fully offline file.

   1. Helpers              6. Derived data
   2. Storage              7. UI kit
   3. Templates            8. Navigation
   4. State & migration    9. Pages
   5. CBE grading engine  10. Backup, lock, boot
   ================================================================== */

/* ==================================================================
   1. HELPERS
   ================================================================== */
const $  = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function uid(){ return 'x' + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-3); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

function num(v){
  if(v === null || v === undefined) return null;
  const s = String(v).trim();
  if(s === '') return null;
  const n = parseFloat(s);
  return isFinite(n) ? n : null;
}
function r1(n){ return Math.round(n + Number.EPSILON); }   /* marks are kept as whole numbers */
function fx(n, dp){
  if(n === null || n === undefined || !isFinite(n)) return '—';
  return String(Math.round(n));   /* whole numbers, whatever decimals were asked for */
}
function today(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function niceDate(v){
  if(!v) return '';
  const d = new Date(v);
  if(isNaN(d)) return '';
  return d.getDate() + '/' + d.toLocaleString('en',{month:'short'}) + '/' + d.getFullYear();
}
function firstName(full){ return String(full || '').trim().split(/\s+/)[0] || 'The learner'; }
function has(hay, needle){
  return String(hay || '').toLowerCase().indexOf(String(needle || '').toLowerCase()) >= 0;
}
function sortByArr(arr, key, dir){
  const s = dir === 'desc' ? -1 : 1;
  return arr.slice().sort((a,b) => {
    const x = a[key], y = b[key];
    if(typeof x === 'number' && typeof y === 'number') return (x - y) * s;
    return String(x == null ? '' : x).localeCompare(String(y == null ? '' : y)) * s;
  });
}

/* ==================================================================
   Share as PDF
   ------------------------------------------------------------------
   The app has no external libraries, so a real PDF is produced by
   handing a clean, self-contained document to the browser's own
   print-to-PDF (works offline on Windows, Android and iPad). The
   same HTML is also offered to the system share sheet as a file
   when the device supports it, so it can go to WhatsApp or email.
   ================================================================== */
const BLACK_TABLE_CSS = `
.report-sheet:not([data-sheet]) table.rpt,.cl-full table.rpt,.pdfdoc table.grid,.pdfdoc table.rpt{border-collapse:collapse;color:#000!important}
.report-sheet:not([data-sheet]) table.rpt th,.report-sheet:not([data-sheet]) table.rpt td,.cl-full table.rpt th,.cl-full table.rpt td,.pdfdoc table.grid th,.pdfdoc table.grid td,.pdfdoc table.rpt th,.pdfdoc table.rpt td{border:1px solid #000!important;color:#000!important;background-image:none!important}
.report-sheet:not([data-sheet]) table.rpt thead th,.cl-full table.rpt thead th,.pdfdoc table.grid thead th,.pdfdoc table.rpt thead th{background:#e4e4e4!important;font-weight:800!important}
.report-sheet:not([data-sheet]) table.rpt tbody td,.cl-full table.rpt tbody td,.pdfdoc table.grid tbody td,.pdfdoc table.rpt tbody td{background:#fff!important}
.report-sheet:not([data-sheet]) table.rpt tfoot td,.cl-full table.rpt tfoot td,.pdfdoc table.grid tfoot td,.pdfdoc table.rpt tfoot td{background:#efefef!important;font-weight:800!important}
.pdfdoc table.grid .chip,.cl-full .chip{color:#000!important;background:#fff!important;border:1px solid #000}
.cl-full table.rpt{font-size:11.5px!important;width:100%}
.cl-full{display:flex;flex-direction:column;min-height:277mm;box-sizing:border-box}
.cl-full table.rpt{flex:0 0 auto}
.cl-full .rpt-head{border-bottom-color:#000!important}

.cl-full .rpt-head,.cl-full .rpt-head *,#pvPaper .cl-full .rpt-head,#clPrint .rpt-head{background:none!important;background-image:none!important;border-image:none!important;box-shadow:none!important;color:#000!important;text-shadow:none!important}
.cl-full .rpt-head{border-bottom:2px solid #000!important}
.cl-full .rpt-head .ht .s1,.cl-full .rpt-head .ht .s2,.cl-full .rpt-head .ht .s3{color:#000!important}
.cl-full,.pv-page:has(.cl-full){background:#fff!important}
`;
function shareStyles(){
  const sheet = $('style');
  return sheet ? sheet.textContent : '';
}
/** Build a printable document around the inner HTML of one element.
 *  `bare` drops the document header, for a job whose sheets already open with
 *  the school name — otherwise that name is printed twice, with a block of
 *  other text sitting above it. `docTitle` becomes the document title, which
 *  is the name the browser offers when the file is saved as a PDF. */
function buildPdfDoc(title, innerHtml, bare, docTitle){
  const s = App.settings;
  return `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<title>${esc(docTitle || title)}</title>
<style>${shareStyles()}
body{background:#fff}
${String(innerHtml).indexOf('ms-land') >= 0 ? '@page{size:A4 landscape;margin:0}' : ''}
.pdf-head{border-bottom:3px solid #0f5132;padding-bottom:6px;margin-bottom:10px;
  display:flex;align-items:center;gap:12px}
.pdf-head img{max-width:64px;max-height:64px;object-fit:contain}
.pdf-head .ht{flex:1;text-align:center}
.pdf-head .s1{font-size:17px;font-weight:800;color:#0f5132;text-transform:uppercase}
.pdf-head .s2{font-size:12.5px;font-weight:700;text-transform:uppercase}
.pdf-head .s3{font-size:11px;color:#555;font-style:italic}
${BLACK_TABLE_CSS}
.report-sheet[data-sheet]{height:295mm!important;min-height:0!important;overflow:hidden!important}
</style></head><body class="pdfdoc">
${bare ? '' : `<div class="pdf-head">
  ${s.logo ? `<img src="${s.logo}" alt="">` : ''}
  <div class="ht">
    <div class="s1">${esc(s.schoolName)}</div>
    <div class="s2">${esc(title)}</div>
    <div class="s3">${esc(s.grade)}${s.stream ? ' ' + esc(s.stream) : ''} · ${esc(activeTerm())}${s.year ? ' · ' + esc(s.year) : ''} · Class Teacher: ${esc(classTeacherOf())}</div>
  </div>
</div>`}
${innerHtml}
</body></html>`;
}
function pdfFileName(title){
  const s = App.settings;
  return (s.grade + ' ' + (s.stream || '') + ' ' + title).replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g,'').toLowerCase();
}
/**
 * Share a section as PDF. Picks the inner HTML of `selector`, opens the
 * print dialog so the teacher can choose "Save as PDF", and on devices
 * with the Web Share API also offers the file to other apps.
 */
async function shareAsPdf(title, selector){
  const src = $(selector);
  if(!src){ toast('Nothing to share yet.', {bad:true}); return; }
  return shareHtmlAsPdf(title, src.innerHTML);
}
/**
 * Share a ready-made block of HTML as PDF — used where the sheets are built for
 * the job rather than already sitting on the page (one learner, or a whole
 * class that is not on screen).
 */
async function shareHtmlAsPdf(title, html){
  if(!html || !html.trim()){ toast('Nothing to share yet.', {bad:true}); return; }
  return shareDocAsPdf(title, buildPdfDoc(title, flattenSheetFields(html)));
}
/**
 * Offer a finished document to the teacher: the system share sheet where the
 * device has one, otherwise the print dialog with “Save as PDF”, otherwise the
 * file itself. The browser's own print engine is what produces the PDF, so the
 * saved file is exactly the report that was on screen. The report form's own
 * Save PDF buttons do not come through here — they write the file directly.
 */
async function shareDocAsPdf(title, doc){
  const name = pdfFileName(title) + '.html';
  const file = new File([doc], name, {type:'text/html'});

  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file], title:title, text:title});
      return;
    }catch(err){
      if(err && err.name === 'AbortError') return;
    }
  }
  /* Fall back to the print dialog, which is how a PDF is made offline. */
  const w = openPrintWindow(doc);
  if(!w){
    download(name, doc, 'text/html');
    toast('Opened the printable copy — use your browser to save it as a PDF.');
    return;
  }
  toast('Print dialog opened — choose “Save as PDF”, then “Save”.');
}
/**
 * Put a finished document in its own window and hand it to the print dialog.
 * A big job is printed this way rather than on the live page, so the app never
 * has to hold hundreds of report pages at once. Returns null when the browser
 * blocks the window, so the caller can fall back to printing in place.
 */
function openPrintWindow(doc){
  const w = window.open('', '_blank');
  if(!w) return null;
  w.document.open();
  w.document.write(doc);
  w.document.close();
  try{
    w.document.querySelectorAll('input,textarea,button,select').forEach(n => {
      if(n.tagName === 'TEXTAREA'){
        const d = w.document.createElement('div');
        d.textContent = n.value;
        d.style.cssText = 'white-space:pre-wrap;font:inherit;padding:0;margin:0';
        n.replaceWith(d);
      }else if(n.tagName === 'INPUT'){
        const s = w.document.createElement('span');
        s.textContent = n.value;
        n.replaceWith(s);
      }else n.remove();
    });
  }catch(_){}
  w.focus();
  setTimeout(() => { try{ w.print(); }catch(_){} }, 20);
  return w;
}

/**
 * Turn the form controls on a sheet into plain text, so a shared or printed
 * copy carries the words the teacher typed instead of empty input boxes.
 */
function flattenSheetFields(html){
  let root;
  try{ root = new DOMParser().parseFromString('<div>' + html + '</div>', 'text/html').body.firstElementChild; }
  catch(_){ return html; }
  if(!root) return html;
  Array.prototype.forEach.call(root.querySelectorAll('textarea'), n => {
    const d = root.ownerDocument.createElement('div');
    d.textContent = n.value;
    d.style.cssText = 'white-space:pre-wrap;font:inherit;padding:0;margin:0';
    n.replaceWith(d);
  });
  Array.prototype.forEach.call(root.querySelectorAll('input'), n => {
    const s = root.ownerDocument.createElement('span');
    s.textContent = n.value;
    n.replaceWith(s);
  });
  Array.prototype.forEach.call(root.querySelectorAll('button,select'), n => n.remove());
  return root.innerHTML;
}

/* ==================================================================
   A REAL .pdf, WRITTEN BY HAND
   ------------------------------------------------------------------
   The app carries no libraries, so a PDF that can simply be downloaded
   is written here byte by byte: A4 pages, one per learner, drawn with
   the base-14 Helvetica fonts that every reader already has. Every line
   is measured against the real Helvetica widths, so words wrap where
   they are measured instead of running off the page, and nothing is
   fetched, so this works with no connection at all.

   The print buttons still hand the job to the browser, which reproduces
   the on-screen sheet exactly. These buttons write the file instead, so
   one click leaves a PDF in the Downloads folder under the learner's
   own name.
   ================================================================== */
let PDF_W = 595.28, PDF_H = 841.89;   /* A4 portrait; swapped briefly for landscape tables */

    /* Keep one line for the ellipsis that records what was left out. */

  if(tel) doc.centreIn(left, R, y + 51, pdfFit(tel, R - left, 8, false), 8, false, PDF_MUTED);

  doc.text(L + 8, y + 19, pdfFit(assessmentNumber(l), W * 0.26, 12, true), 12, true);
  doc.centre(L + W / 2, y + 9, 'LEARNER NAME', 6.5, true, PDF_MUTED);
  doc.centre(L + W / 2, y + 19, pdfFit(l.name || '', W * 0.4, 12, true), 12, true);

  doc.centre(mid(2), y + 9.5, String(c.points), 7.5, true, PDF_DARK);
  doc.centre(mid(3), y + 9.5, abbrOf(c.average), 7.5, true, PDF_DARK);
  doc.centre(mid(4), y + 9.5, mean === null ? '—' : fx(mean, 1), 7.5, true, PDF_DARK);
  doc.text(cxs[5] + 4, y + 9.5, pdfFit(c.average === null ? 'No marks recorded' : CATEGORY_WORD[category(c.average)], W * cols[5] - 6, 7.5, true), 7.5, true, PDF_DARK);
  y += 22;

  /* ---------- class standing beside the grade key ---------- */
  const rowsL = [
    ['Class mean', mean === null ? '—' : fx(mean, 1) + '%'],
    ['Class overall grade', og ? og.abbr + ' — ' + og.desc : '—'],
    ['Learner\'s average', c.average === null ? '—' : fx(c.average, 1) + '% (' + abbrOf(c.average) + ')'],
    ['Against class mean', classGap(c, mean)],
    ['Strongest subject', bestSubject(c)],
    ['Subject needing improvement', worstSubject(c)]
  ];
  const rowsR = [['Grade', 'Range', 'Pts', 'Meaning']]
    .concat(thresholds().map(t => [t.abbr, t.range, String(t.points), t.desc]));
  const step = 11, bw = (W - 8) / 2;
  const boxH = 16 + Math.max(rowsL.length, rowsR.length) * step + 5;
  doc.box(L, y, bw, boxH);
  doc.box(L + bw + 8, y, bw, boxH);
  doc.text(L + 5, y + 10, pdfFit('CLASS PERFORMANCE (' + exam.name + ')', bw - 10, 7, true), 7, true, PDF_INK);
  doc.text(L + bw + 13, y + 10, 'GRADE KEY (CBE)', 7, true, PDF_INK);
  rowsL.forEach((r, i) => {
    const ry = y + 16 + i * step;
    doc.text(L + 5, ry + 7.5, r[0], 7, false, false, PDF_MUTED);
    doc.text(L + bw * 0.46, ry + 7.5, pdfFit(r[1], bw * 0.52 - 6, 7, true), 7, true);
  });
  const rc = [0.17, 0.26, 0.11, 0.46];
  const keyH = 11;
  doc.box(L + bw + 10, y + 14, bw - 17, keyH, PDF_KEYFIL, null);
  rowsR.forEach((r, i) => {
    const ry = y + 16 + i * step;
    let rx = L + bw + 13;
    r.forEach((cell, j) => {
      doc.text(rx, ry + 7.5, pdfFit(cell, bw * rc[j] - 4, 6.5, i === 0), 6.5, i === 0, false, i === 0 ? PDF_DARK : PDF_BLACK);
      rx += bw * rc[j];
    });
  });
  y += boxH + 12;

  /* The remarks carry the most writing on the sheet, so they get the larger share
     of what is left; both stop short of the signatures at the foot. */
  const sigFloor = PDF_H - PDF_M - 76;
  y = pdfTextBlock(doc, L, R, y, 'CLASS TEACHER\'S REMARKS', remark, 10, 16, sigFloor - 34);
  y = pdfTextBlock(doc, L, R, y, 'SCHOOL NOTICE & ANNOUNCEMENTS', noticeFor(s.grade + '|' + examId), 11, 10, sigFloor);

  /* ---------- signatures, at the foot of the page ---------- */
  const sigTop = PDF_H - PDF_M - 68;
  const cw = W / 2;
  const cells = [[classTeacherOf(), sigA, 'Class Teacher'],
                 [s.headTeacher || '', sigB, 'Head Teacher']];
  cells.forEach((cell, i) => {
    const cx = L + cw * i + cw / 2;
    doc.centre(cx, sigTop, pdfFit(cell[0], cw - 14, 9, true), 9, true, PDF_DARK);
    doc.fitted(cx - cw * 0.32, sigTop + 13, cw * 0.64, 30, cell[1]);
    doc.line(cx - cw * 0.32, sigTop + 44, cx + cw * 0.32, sigTop + 44, 0.8, PDF_INK);
    doc.centre(cx, sigTop + 56, cell[2], 7.5, false, PDF_MUTED);
  });
  doc.text(14, PDF_H - PDF_M + 9, 'BN Alama CBE reports', 6.5, true, false, PDF_DARK);
}

/* ==================================================================
   Paging
   ------------------------------------------------------------------
   The learner register has no size limit, but no browser can draw
   millions of <input> boxes at once. Anything longer than a page is
   rendered a page at a time, so a class of any size still opens
   instantly and typing a number never means nothing.
   ================================================================== */
const PAGE_SIZE = 250;
function pageCount(total){ return Math.max(1, Math.ceil(total / PAGE_SIZE)); }
function currentPage(){
  const n = pageCount(currentPageTotal());
  const p = Number(App.filters.page) || 1;
  return Math.min(Math.max(1, p), n);
}
function currentPageTotal(){ return App.pageTotal || 0; }
function pageSlice(list){
  const p = currentPage();
  const start = (p - 1) * PAGE_SIZE;
  return {slice:list.slice(start, start + PAGE_SIZE), start, from:start + 1,
          to:Math.min(start + PAGE_SIZE, list.length), total:list.length};
}
function setPage(p){
  App.filters.page = p;
  RENDER[App.page]();
  window.scrollTo(0, 0);
}
/** "Showing 1–250 of 1,204 learners" plus the Next / Previous buttons. */
function pager(total, noun, onGo){
  const {from, to} = pageSlice(new Array(total));
  const p = currentPage(), n = pageCount(total);
  const go = onGo || setPage;
  return `<div class="pager">
    <span>Showing <b>${from.toLocaleString()}–${to.toLocaleString()}</b> of
      <b>${total.toLocaleString()}</b> ${esc(noun || 'rows')}</span>
    <span class="spacer"></span>
    <button class="sm" data-pg="first" ${p <= 1 ? 'disabled' : ''}>⏮ First</button>
    <button class="sm" data-pg="prev" ${p <= 1 ? 'disabled' : ''}>◀ Previous</button>
    <span>Page <b>${p}</b> of <b>${n}</b></span>
    <button class="sm" data-pg="next" ${p >= n ? 'disabled' : ''}>Next ▶</button>
    <button class="sm" data-pg="last" ${p >= n ? 'disabled' : ''}>Last ⏭</button>
  </div>`;
}
function wirePager(root, total, onGo){
  const box = root || document;
  $$('[data-pg]', box).forEach(b => b.onclick = () => {
    const p = currentPage(), n = pageCount(total);
    const k = b.dataset.pg;
    const target = k === 'first' ? 1 : k === 'prev' ? p - 1 : k === 'next' ? p + 1 : n;
    (onGo || setPage)(target);
  });
}
/** Objects at or beyond this count still work, but need paging first. */
const HUGE = 5000;

/* ---------- Files ---------- */
function download(filename, content, mime){
  const blob = new Blob([content], {type:(mime || 'text/plain') + ';charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 800);
}
function toCSV(headers, rows){
  const q = v => {
    const s = (v === null || v === undefined) ? '' : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  };
  return [headers.map(q).join(',')].concat(rows.map(r => r.map(q).join(','))).join('\r\n');
}
function parseDelimited(text){
  text = String(text || '').replace(/\r\n?/g,'\n').replace(/^\ufeff/,'');
  const first = text.split('\n')[0] || '';
  const delim = first.split('\t').length > first.split(',').length ? '\t' : ',';
  const rows = [];
  let row = [], cell = '', quoted = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(quoted){
      if(c === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else quoted = false; }
      else cell += c;
    }else{
      if(c === '"') quoted = true;
      else if(c === delim){ row.push(cell); cell = ''; }
      else if(c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
      else cell += c;
    }
  }
  if(cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}
function pickFile(cb, accept){
  const inp = $('#filePick');
  inp.value = '';
  if(accept) inp.accept = accept;
  inp.onchange = () => {
    const f = inp.files[0];
    if(!f) return;
    const rd = new FileReader();
    rd.onload = () => cb(String(rd.result || ''));
    rd.readAsText(f);
  };
  inp.click();
}

/* ==================================================================
   2. STORAGE  (IndexedDB, with an automatic localStorage fallback)
   ================================================================== */
const Store = (function(){
  const DB_NAME = 'cbe_reporting_db', STORE = 'kv';
  let db = null, fallback = false, mem = null;

  function all(){
    if(!mem){
      mem = {};
      try{
        for(let i = 0; i < localStorage.length; i++){
          const k = localStorage.key(i);
          if(k && k.indexOf('cbe_') === 0){
            try{ mem[k.slice(4)] = JSON.parse(localStorage.getItem(k)); }catch(_){}
          }
        }
      }catch(_){}
    }
    return mem;
  }
  function openDB(){
    return new Promise((resolve, reject) => {
      let req;
      try{ req = indexedDB.open(DB_NAME, 1); }catch(e){ return reject(e); }
      req.onupgradeneeded = e => {
        const d = e.target.result;
        if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE);
      };
      req.onsuccess = e => resolve(e.target.result);
      req.onerror   = e => reject(e.target.error || new Error('IndexedDB failed'));
      req.onblocked = () => reject(new Error('IndexedDB blocked'));
      /* Some browsers never answer for file:// pages; do not make the
         teacher wait for the fallback. */
      setTimeout(() => { if(req.readyState !== 'done') reject(new Error('timeout')); }, 1200);
    });
  }
  async function init(){
    if(db || fallback) return;
    try{ db = await openDB(); }
    catch(e){ fallback = true; console.warn('Using localStorage fallback.', e); }
  }

  return {
    get usingFallback(){ return fallback; },

    async get(name){
      await init();
      if(db){
        const v = await new Promise(res => {
          try{
            const t = db.transaction(STORE,'readonly').objectStore(STORE).get(name);
            t.onsuccess = () => res(t.result === undefined ? null : t.result);
            t.onerror   = () => res(null);
          }catch(_){ res(null); }
        });
        if(v !== null) return v;
      }
      const a = all();
      return a[name] === undefined ? null : a[name];
    },

    async set(name, value){
      await init();
      if(db){
        try{
          await new Promise((res, rej) => {
            const t = db.transaction(STORE,'readwrite');
            t.objectStore(STORE).put(value, name);
            t.oncomplete = res;
            t.onerror = t.onabort = () => rej(t.error || new Error('write failed'));
          });
          return true;
        }catch(e){ fallback = true; db = null; console.warn('Using localStorage fallback.', e); }
      }
      all()[name] = value;
      try{ localStorage.setItem('cbe_' + name, JSON.stringify(value)); }
      catch(_){ toast('Could not save: this computer\'s storage is full.', {bad:true}); return false; }
      return true;
    },

    async del(name){
      await init();
      if(db){
        try{
          await new Promise(res => {
            const t = db.transaction(STORE,'readwrite');
            t.objectStore(STORE).delete(name);
            t.oncomplete = res; t.onerror = () => res();
          });
        }catch(_){}
      }
      delete all()[name];
      try{ localStorage.removeItem('cbe_' + name); }catch(_){}
    }
  };
})();

async function loadAll(){
  App.settings = await Store.get(DBKEY.settings);
  if(!App.settings) App.settings = clone(DEFAULT_SETTINGS);

  const base = clone(DEFAULT_SETTINGS);
  for(const k in base) if(App.settings[k] === undefined) App.settings[k] = base[k];
  if(!Array.isArray(App.settings.optional)) App.settings.optional = [];
  if(typeof App.settings.optionalOutOf !== 'object' || !App.settings.optionalOutOf)
    App.settings.optionalOutOf = {};
  if(TERM_LIST.indexOf(App.settings.term) < 0) App.settings.term = 'Term I';
  if(typeof App.settings.year !== 'string' || !App.settings.year)
    App.settings.year = String(new Date().getFullYear());

  /* Older files said "Term 1" / "Term 2" / "Term 3". */
  const TERM_FIX = {'Term 1':'Term I', 'Term 2':'Term II', 'Term 3':'Term III'};

  if(!Array.isArray(App.settings.assessments) || !App.settings.assessments.length)
    App.settings.assessments = clone(EXAM_LIST);
  App.settings.assessments.forEach(a => {
    if(!a.outOf) a.outOf = {};
    if(!a.type) a.type = 'exam';
    if(TERM_FIX[a.term]) a.term = TERM_FIX[a.term];
    if(!a.term) a.term = 'Term I';
    if(!a.name) a.name = 'Exam';
  });
  if(!Array.isArray(App.settings.gradeProfiles) || !App.settings.gradeProfiles.length)
    App.settings.gradeProfiles = clone(GRADE_PROFILES);
  /* Older files shipped a different lower-primary list; realign the profiles —
     but a list the teacher has edited is theirs and is left alone. */
  const shipped = {};
  GRADE_PROFILES.forEach(p => { shipped[p.label] = clone(p.subjects); });
  App.settings.gradeProfiles.forEach(p => {
    if(p.subjectsEdited) return;
    if(shipped[p.label]) p.subjects = shipped[p.label];
  });
  if(!Array.isArray(App.settings.subjects) || !App.settings.subjects.length){
    const prof = App.settings.gradeProfiles.find(p => p.label === App.settings.grade);
    App.settings.subjects = applyOptional(prof ? prof.subjects : JUNIOR_SUBJECTS, profExclude(prof));
  }else{
    /* A subject ticked in Optional Subjects must be present in the live list. */
    optionalOn().forEach(n => {
      if(App.settings.subjects.some(x => x.name === n)) return;
      const d = optionalSubjectDef(n);
      const of = App.settings.optionalOutOf && App.settings.optionalOutOf[n];
      App.settings.subjects.push({name:n, optional:true,
        outOf: of !== undefined && of !== '' && Number(of) > 0 ? Number(of) : (Number(d.outOf) || 100)});
    });
  }
  if(!Array.isArray(App.settings.cohorts) || !App.settings.cohorts.length)
    App.settings.cohorts = [{id:'coh_' + uid(), grade:App.settings.grade, stream:App.settings.stream,
                             year:App.settings.year, name:App.settings.grade}];
  App.settings.cohorts.forEach(c => {
    if(c.grade === undefined) c.grade = App.settings.grade;
    if(c.stream === undefined) c.stream = '';
    if(c.year === undefined) c.year = App.settings.year;
    /* Older files stored the year in the name; the edit box shows the name only. */
    c.name = c.name ? String(c.name).replace(/\s*·\s*\d{4}\s*$/, '').trim() : cohortPlainName(c);
  });
  const coh = ensureCohort(App.settings.grade, App.settings.stream, true);
  App.settings.activeCohortId = coh.id;

  App.learners = (await Store.get(DBKEY.learners)) || [];
  App.raw      = (await Store.get(DBKEY.raw))      || [];
  App.cats     = (await Store.get(DBKEY.cats))     || [];
  App.remarks  = (await Store.get(DBKEY.reportRemarks)) || {};
  App.notices  = (await Store.get(DBKEY.reportNotices)) || {};

  App.learners.forEach(l => { if(!l.cohortId) l.cohortId = App.settings.activeCohortId; });
  App.raw.forEach(r     => { if(!r.cohortId) r.cohortId = coh; });
  App.cats.forEach(c    => { if(!c.cohortId) c.cohortId = coh; });

  /* Rows saved by an older version carried only a term name. */
  const A = App.settings.assessments;
  App.raw.forEach(r => {
    if(r.assessmentId && A.some(a => a.id === r.assessmentId)) return;
    let hit = A.find(a => a.term === r.term);
    if(!hit) hit = A.find(a => a.name.toLowerCase() === String(r.term || '').toLowerCase());
    if(!hit) hit = A.find(a => String(r.term || '').toLowerCase().indexOf(String(a.term || '').toLowerCase()) >= 0);
    r.assessmentId = hit ? hit.id : (exams()[0] || A[0]).id;
    if(hit) r.term = hit.term;
  });
}

/* ---------- Classes (one cohort per grade + stream) ---------- */
function cohort(){
  return App.settings.cohorts.find(c => c.id === App.settings.activeCohortId) || App.settings.cohorts[0];
}
function cohortLabel(c){
  c = c || cohort();
  if(!c) return 'Class';
  const base = [c.grade || 'Class', c.stream ? String(c.stream).toUpperCase() : ''].join(' ').trim();
  return c.year ? base + ' · ' + c.year : base;
}
function cohortKeyFor(grade, stream){ return grade + '||' + (stream || ''); }
/** The class name without the year, e.g. "Grade 2 Orange". */
function cohortPlainName(c){
  c = c || cohort();
  if(!c) return '';
  return [c.grade || 'Class', c.stream ? String(c.stream).toUpperCase() : '']
    .join(' ').replace(/\s+/g, ' ').trim();
}
/**
 * The name the teacher typed for a class. A grade with no extra classes keeps the
 * plain grade name, so "Grade 2"; a split grade reads "Grade 2 Orange".
 */
function cohortName(c){
  c = c || cohort();
  if(!c) return '';
  return c.name || cohortPlainName(c);
}
/**
 * Read a typed class name back into its grade and its extra part. "Grade 2" is
 * just the grade, "Grade 2 Orange" and "Orange" both give grade "Grade 2" with
 * "Orange" as the class name.
 */
function splitCohortName(c, typed){
  const raw = String(typed || '').trim().replace(/\s+/g, ' ');
  if(!raw) return null;
  const own = String(c.grade || '').replace(/\s+/g, ' ');
  const safe = own.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  let m = own ? new RegExp('^(' + safe + ')\\s*(.*)$', 'i').exec(raw) : null;
  if(!m) m = /^(grade\s*\d+)\s*(.*)$/i.exec(raw);
  return m
    ? {grade: m[1].replace(/\s+/g, ' '), stream: (m[2] || '').trim(), name: raw}
    : {grade: c.grade || raw, stream: raw, name: c.grade ? c.grade + ' ' + raw : raw};
}
/**
 * Delete only the marks of a class — every exam score, CAT and report remark —

/**

async function confirmDelete(what, detail, opts){
  opts = opts || {};

    `Are you sure you want to ${verb} ${esc(what)}?` + (detail ? '<br><br>' + detail : ''),
    {title: opts.title || 'Are you sure?',
     okLabel: opts.okLabel || ('Yes, ' + verb),

/**
 * Delete a class together with its learners, marks and CATs.
 *
 * The teacher is always asked first — Home's button passes ask:false only
 * because it has already shown the same question. `opts.last` allows the grade's
 * only class to go; a fresh empty class is then opened in its place so the grade
 * always has somewhere to enrol.
 */
async function deleteCohort(id, opts){
  opts = opts || {};
  const c = App.settings.cohorts.find(x => x.id === id);
  if(!c) return false;
  const sameGrade = App.settings.cohorts.filter(x => (x.grade || '') === (c.grade || ''));
  if(sameGrade.length <= 1 && !opts.last){
    toast('A grade must keep at least one class. Delete it from Home if that is what you want.');
    return false;
  }
  const label = cohortLabel(c);
  const ln = App.learners.filter(l => l.cohortId === c.id).length;
  const rn = App.raw.filter(r => r.cohortId === c.id).length;
  const cn = App.cats.filter(x => x.cohortId === c.id).length;
  if(opts.ask !== false){
    const ok = await confirmDelete('the class ' + label,
      `It holds <b>${ln}</b> learner(s), <b>${rn}</b> mark row(s) and <b>${cn}</b> CAT record(s).` +
      (sameGrade.length <= 1
        ? `<br><br>It is the only class on the grade, so an empty <b>${esc(c.grade)}</b> will be opened in its place.` : '') +
      '<br><br>Export a backup first if you may need them again.',
      {title:'Delete class', okLabel:'Yes, delete the class'});
    if(!ok) return false;
  }

  const goneIds = App.learners.filter(l => l.cohortId === c.id).map(l => l.id);
  Object.keys(App.remarks).forEach(k => {
    if(goneIds.some(id => k.indexOf(id + '|') === 0)) delete App.remarks[k];
  });
  const grade = c.grade;
  let wasActive = App.settings.activeCohortId === c.id;
  App.settings.cohorts = App.settings.cohorts.filter(x => x.id !== c.id);
  App.learners = App.learners.filter(l => l.cohortId !== c.id);
  App.raw      = App.raw.filter(r => r.cohortId !== c.id);
  App.cats     = App.cats.filter(x => x.cohortId !== c.id);

  /* Removing the whole grade should not leave an empty class behind. */
  if(!opts.keepGrade && !App.settings.cohorts.length){
    App.settings.cohorts.push(ensureCohort(grade, '', true));
    wasActive = true;
  }
  if(wasActive && !opts.keepGrade){
    /* Stay on the same grade when it still has a class, else open a fresh one. */
    const left = App.settings.cohorts.find(x => (x.grade || '') === grade);
    const target = left || ensureCohort(grade, '', true);
    App.settings.activeCohortId = target.id;
    App.settings.grade  = target.grade;
    App.settings.stream = target.stream || '';
    App.settings.year   = target.year || App.settings.year;
  }
  App.filters.exam = null; App.filters.enSearch = ''; App.filters.clSearch = '';
  await saveSettings(); await saveLearners(); await saveRaw(); await saveCats(); await saveRemarks();
  if(opts.keepGrade){
    /* The grade itself is going, so leave the open class pointing nowhere for
       the caller to resolve. */
    resetPageState();
  } else if(App.settings.grade !== grade){
    await switchGrade(grade, {skipConfirm:true});
  } else {
    resetPageState(); await saveSettings();
  }
  paintChrome();
  if(App.page === 'settings') renderSettings();
  toast('Class “' + label + '” deleted.');
  return true;
}

/* ---------- Subjects ---------- */
/**
 * Optional subjects the school has switched on (Agriculture, Creative Arts,
 * Home Science, ...). They are appended after the grade's core subjects, so
 * they only ever reach the report form when a teacher selects them here.
 */
function optionalOn(){
  return (App.settings.optional || []).filter(n =>
    OPTIONAL_SUBJECTS.some(o => o.name === n) || subjectExistsInProfiles(n));
}
function subjectExistsInProfiles(n){
  return (App.settings.gradeProfiles || []).some(p => p.subjects.some(x => x.name === n));
}
function optionalSubjectDef(n){
  const o = OPTIONAL_SUBJECTS.find(x => x.name === n);
  if(o) return o;
  for(const p of (App.settings.gradeProfiles || [])){
    const hit = p.subjects.find(x => x.name === n);
    if(hit) return hit;
  }
  return {name:n, outOf:100};
}
/** Core grade subjects plus every optional subject switched on. */
function applyOptional(core, exclude){
  const skip = exclude || [];
  const list = clone(core || []);
  optionalOn().forEach(n => {
    if(skip.indexOf(n) >= 0) return;
    if(list.some(x => x.name === n)) return;
    const d = optionalSubjectDef(n);
    const of = App.settings.optionalOutOf && App.settings.optionalOutOf[n];
    list.push({name:n, outOf: of !== undefined && of !== '' && Number(of) > 0 ? Number(of) : (Number(d.outOf) || 100), optional:true});
  });
  return list;
}
/** Optional subjects a grade has deliberately taken off its own list. */
function profExclude(p){ return (p && p.exclude) || []; }
/** The subject list a grade ships with, used to restore its defaults. */
function gradeDefaultSubjects(label){
  const shipped = GRADE_PROFILES.find(p => p.label === label);
  if(shipped) return clone(shipped.subjects);
  return label.indexOf('7') >= 0 || label.indexOf('8') >= 0 || label.indexOf('9') >= 0
    ? clone(JUNIOR_SUBJECTS) : clone(LOWER_SUBJECTS);
}
function profileOf(grade){
  const label = grade || App.settings.grade;
  return (App.settings.gradeProfiles || []).find(p => p.label === label) || null;
}
/**
 * Write a grade's subject list back into its own profile, so Exam Raw Marks,
 * Exam Processed Scores, the Report Form, the Marks Sheet and Subject Analysis all
 * use exactly this list. An optional subject the teacher renames or removes is
 * excluded for that grade, otherwise it would be appended again on the next
 * load.
 */
async function saveGradeSubjects(grade, list, prevNames){
  const s = App.settings;
  const label = grade || s.grade;
  let prof = profileOf(label);
  if(!prof){ prof = {id:'g' + uid(), label:label, subjects:[]}; s.gradeProfiles.push(prof); }
  const wanted = (list || []).map(x => ({name:x.name, outOf:Number(x.outOf) || 100}));

  /* The order the teacher sees is the order kept, so a renamed subject stays
     in its own row instead of jumping to the bottom of the list. */
  const prev = prevNames || (prof.subjects || []).map(x => x.name);
  const next = [], used = new Set();
  prev.forEach((oldName, i) => {
    const row = wanted[i];
    if(!row || used.has(row.name)) return;
    used.add(row.name);
    next.push({name:row.name, outOf:row.outOf});
  });
  wanted.forEach(row => {
    if(used.has(row.name)) return;
    used.add(row.name);
    next.push({name:row.name, outOf:row.outOf});
  });

  prof.subjects   = next;
  prof.subjectsEdited = true;
  const keep = wanted.map(x => x.name);
  const ex = new Set(profExclude(prof));
  optionalOn().forEach(nm => { if(keep.indexOf(nm) < 0) ex.add(nm); else ex.delete(nm); });
  if(ex.size) prof.exclude = [...ex]; else delete prof.exclude;

  if(label === s.grade) s.subjects = applyOptional(prof.subjects, profExclude(prof));
  await saveSettings();
  return prof;
}
function subjectNames(){ return App.settings.subjects.map(s => s.name); }
function subjectByName(n){ return App.settings.subjects.find(s => s.name === n) || null; }
/** Maximum raw mark for a subject in a paper (paper override wins). */
function outOf(name, examId){
  const ex = examById(examId);
  if(ex && ex.outOf && ex.outOf[name] !== undefined && ex.outOf[name] !== '' && Number(ex.outOf[name]) > 0)
    return Number(ex.outOf[name]);
  const s = subjectByName(name);
  return s ? Number(s.outOf) : 100;
}

   Rebuilt whenever the register changes, which saveLearners() signals. */

function learnerUPI(id){ const l = learnerById(id); return l ? l.upi : ''; }

/* ==================================================================
   5. THE CBE GRADING ENGINE
   ------------------------------------------------------------------
   grade(pct) is the single source of truth for abbreviation, points,
   level and description. Every page reads from this one function.
   ================================================================== */
function thresholds(){
  return (App.settings.thresholds || []).slice().sort((a,b) => b.min - a.min);
}
function grade(pct){
  if(pct === null || pct === undefined || pct === '' || isNaN(pct)) return null;
  const th = thresholds();
  if(!th.length) return null;
  if(pct < 1) return Object.assign({}, th[th.length-1], {min:0, abbr:'BE2', points:0, desc:'No mark'});
  for(const t of th){ if(pct >= t.min) return t; }
  return th[th.length-1];
}
function pointsOf(pct){ const g = grade(pct); return g ? g.points : 0; }
function abbrOf(pct){ const g = grade(pct); return g ? g.abbr : '—'; }
function descOf(pct){ const g = grade(pct); return g ? g.desc : '—'; }

/** CBE category: EE >=75, ME 41-<75, AE 21-<41, BE below 21. */
function category(pct){
  if(pct === null || pct === undefined || isNaN(pct)) return null;
  if(pct >= 75) return 'EE';
  if(pct >= 41) return 'ME';
  if(pct >= 21) return 'AE';
  return 'BE';
}
const CATEGORY_WORD = {
  EE:'Exceeding Expectations', ME:'Meeting Expectations',
  AE:'Approaching Expectations', BE:'Below Expectations'
};
function closingSentence(avg){
  if(avg === null) return '';
  if(avg >= 75) return 'Keep up the excellent work!';
  if(avg >= 58) return 'Consistent effort is paying off – aim even higher next term.';
  if(avg >= 41) return 'With more consistent revision, greater improvement is achievable.';
  if(avg >= 21) return 'Focused effort and extra support in the weaker areas will help raise performance.';
  return 'Requires close guidance and remedial support to improve significantly.';
}
function catRemark(points){
  if(points >= 7) return 'Outstanding Performance';
  if(points >= 5) return 'Satisfactory Performance';
  if(points >= 3) return 'Needs Support';
  return 'Requires Immediate Intervention';
}

/* ==================================================================
   6. DERIVED DATA
   ================================================================== */

/** Percentages for one raw-score row. Blank marks are ignored. */
/**
 * Turn one raw mark row into percentages and points. `subs` defaults to the
 * active grade's subjects, but the whole-school dashboard passes each class's
 * own subject list so Grades 1-6 and 7-9 are measured correctly. Entries may be
 * a subject name or a {name, outOf} pair when the maximum comes from another
 * grade's profile.
 */
function computeRow(row, subs){
  subs = subs || subjectNames();
  const marks = row.marks || {};
  const pct = {}, pts = {}, filled = [];
  let sum = 0, ptot = 0, n = 0;
  subs.forEach(entry => {
    const s = typeof entry === 'object' ? entry.name : entry;
    const raw = num(marks[s]);
    if(raw === null){ pct[s] = null; pts[s] = null; return; }
    const of = typeof entry === 'object' ? Number(entry.outOf) : outOf(s, row.assessmentId);
    const p = of > 0 ? (raw / of) * 100 : 0;
    pct[s] = p; pts[s] = pointsOf(p); filled.push(s);
    sum += p; ptot += pts[s]; n++;
  });
  return {row, pct, pts, filled, count:n, total:r1(sum), points:ptot, average: n ? r1(sum / n) : null};
}

/**
 * The subjects a grade is taught, as {name, outOf} pairs. The dashboard uses
 * these so a Grade 3 mark is divided by the Grade 3 maximum, not the maximum
 * of whichever grade happens to be open in the top bar.
 */
function subjectsOfCohort(c){
  const prof = (App.settings.gradeProfiles || []).find(p => p.label === (c && c.grade));
  return (prof ? applyOptional(prof.subjects, profExclude(prof)) : App.settings.subjects)
    .map(x => ({name:x.name, outOf:Number(x.outOf) || 100}));
}

/**
 * END YEAR AVERAGE for one learner: each subject is the mean of that
 * subject's percentages across every paper the learner sat. Averaging
 * percentages (not raw marks) keeps it correct when papers differ.
 */
function endYearRowFor(learnerId, cohortId){
  const subs = subjectNames();
  const mine = App.raw.filter(r =>
    r.learnerId === learnerId && r.cohortId === cohortId && !isAverageExam(r.assessmentId));
  if(!mine.length) return null;

  const parts = {};
  subs.forEach(s => { parts[s] = []; });
  mine.forEach(r => {
    const c = computeRow(r);
    subs.forEach(s => { if(c.pct[s] !== null) parts[s].push(c.pct[s]); });
  });

  const pct = {}, pts = {}, filled = [], paperCount = {};
  let sum = 0, ptot = 0, n = 0;
  subs.forEach(s => {
    paperCount[s] = parts[s].length;
    if(!parts[s].length){ pct[s] = null; pts[s] = null; return; }
    const p = r1(parts[s].reduce((a,b) => a + b, 0) / parts[s].length);
    pct[s] = p; pts[s] = pointsOf(p); filled.push(s);
    sum += p; ptot += pts[s]; n++;
  });

  const pseudo = {id:'aya_' + learnerId, learnerId, assessmentId:'aya',
                  term:'End Year', cohortId, marks:{}};
  return {row:pseudo, pct, pts, filled, paperCount, count:n, total:r1(sum), points:ptot,
          average: n ? r1(sum / n) : null};
}

/** All computed rows for a paper (End Year Average aggregates them all). */
function computedRows(examId){
  const coh = App.settings.activeCohortId;
  if(examId && isAverageExam(examId))
    return learnersOfCohort().map(l => endYearRowFor(l.id, coh)).filter(Boolean);
  return App.raw
    .filter(r => r.cohortId === coh && (!examId || r.assessmentId === examId))
    .map(r => computeRow(r));
}
function rawRowsForExam(examId){
  return App.raw.filter(r => r.cohortId === App.settings.activeCohortId && r.assessmentId === examId);
}
function classMean(rows, subs){
  subs = (subs || subjectNames()).map(s => typeof s === 'object' ? s.name : s);
  if(!rows.length) return null;
  let sum = 0, n = 0;
  rows.forEach(c => subs.forEach(s => {
    if(c.pct[s] !== null){ sum += c.pct[s]; n++; }
  }));
  return n ? r1(sum / n) : null;
}
function subjectMeans(rows){
  const out = {};
  subjectNames().forEach(s => {
    let sum = 0, n = 0;
    rows.forEach(c => { if(c.pct[s] !== null){ sum += c.pct[s]; n++; } });
    out[s] = n ? r1(sum / n) : null;
  });
  return out;
}
/** Rank 1,2,2,4 by average. Learners with no marks get no rank. */
function withRanks(rows){
  const sorted = rows.filter(c => c.average !== null).sort((a,b) => b.average - a.average);
  const map = {};
  let last = null, rank = 0;
  sorted.forEach((c,i) => {
    if(c.average !== last){ rank = i + 1; last = c.average; }
    map[c.row.id] = rank;
  });
  return rows.map(c => Object.assign(c, {rank: c.average === null ? null : map[c.row.id]}));
}
